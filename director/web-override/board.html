<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />

<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>F1 Director · 看板</title>
<script>
(function(){try{var t=localStorage.getItem('f1-director-theme');if(t!=='day'&&t!=='night'){t='night';try{localStorage.setItem('f1-director-theme',t);}catch(e0){}}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','night');}})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- 独立看板。看板 id 从路径取：/board/tyres 。
     同一个 app.js，所以窗口里的东西和主界面里那一格**是同一段代码画的**。 -->
<div id="board"></div>
<script src="/app.js"></script>
</body>
</html>
