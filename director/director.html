<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark" id="colorSchemeMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>F1 导播台 · Director</title>
<style>
  :root {
    /* night = current dark broadcast look */
    --bg: #06080c;
    --bg-stage: #080b10;
    --bg-elev: #0a0e14;
    --panel: #0d1218;
    --panel-elev: #111820;
    --panel-head: #10161e;
    --border: rgba(255, 255, 255, 0.07);
    --border-hi: rgba(255, 255, 255, 0.12);
    --accent: #e10600;
    --accent-dim: rgba(225, 6, 0, 0.18);
    --teal: #e10600;
    --teal-dim: rgba(225, 6, 0, 0.18);
    --text: #eef3f8;
    --muted: #7d8b9c;
    --muted2: #5a6778;
    --live: #ff3b5c;
    --ok: #ff5a5a;
    --bad: #ff6b7a;
    --warn: #f0b429;
    --bar-h: 46px;
    --head-h: 32px;
    --handle: 8px;
    --r: 10px;
    --r-sm: 6px;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.35);
    --font: "Noto Sans SC", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --topbar-bg: linear-gradient(180deg, #0f141c 0%, #0a0e14 100%);
    --input-bg: rgba(0, 0, 0, 0.35);
    --btn-bg: rgba(255, 255, 255, 0.04);
    --btn-hover: rgba(255, 255, 255, 0.08);
    --btn-text-hover: #ffffff;
    --status-bg: rgba(255, 255, 255, 0.03);
    --stage-glow: #121820;
    --stage-edge: #05070a;
    --panel-body: #05070a;
    --live-panel-bg: #050607;
    --dd-bg: #1a1f2a;
    --dd-hover: #222836;
    --dd-border: rgba(255, 255, 255, 0.14);
    --dd-shadow: 0 16px 48px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.35);
    --inset-line: rgba(255, 255, 255, 0.03);
    --live-ph-bg: radial-gradient(ellipse at center, #1a0c10 0%, #050607 68%);
    --theme-active-bg: rgba(225, 6, 0, 0.18);
    --theme-active-fg: #e10600;
    --status-ok-border: rgba(225, 6, 0, 0.35);
    --status-ok-bg: rgba(225, 6, 0, 0.10);
  }
  html[data-theme="day"] {
    color-scheme: light;
    --teal: #c40500;
    --bg: #eef2f7;
    --bg-stage: #e4eaf2;
    --bg-elev: #f5f7fb;
    --panel: #ffffff;
    --panel-elev: #f7f9fc;
    --panel-head: #eef2f7;
    --border: rgba(15, 23, 42, 0.10);
    --border-hi: rgba(15, 23, 42, 0.16);
    --accent-dim: rgba(225, 6, 0, 0.10);
    --teal-dim: rgba(225, 6, 0, 0.10);
    --text: #0f172a;
    --muted: #5b6b7c;
    --muted2: #8494a7;
    --shadow: 0 12px 36px rgba(15, 23, 42, 0.12);
    --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.08);
    --topbar-bg: linear-gradient(180deg, #ffffff 0%, #f3f6fa 100%);
    --input-bg: rgba(15, 23, 42, 0.04);
    --btn-bg: rgba(15, 23, 42, 0.04);
    --btn-hover: rgba(15, 23, 42, 0.08);
    --btn-text-hover: #0f172a;
    --status-bg: rgba(15, 23, 42, 0.03);
    --stage-glow: #dce4ee;
    --stage-edge: #c8d2e0;
    --panel-body: #f4f7fb;
    --live-panel-bg: #0b0c0e;
    --dd-bg: #ffffff;
    --dd-hover: #f0f4f8;
    --dd-border: rgba(15, 23, 42, 0.14);
    --dd-shadow: 0 16px 40px rgba(15, 23, 42, 0.16), 0 0 0 1px rgba(15, 23, 42, 0.06);
    --inset-line: rgba(15, 23, 42, 0.04);
    --live-ph-bg: radial-gradient(ellipse at center, #ffe8ec 0%, #f4eef0 68%);
    --theme-active-bg: rgba(225, 6, 0, 0.10);
    --theme-active-fg: #c40500;
    --ok: #b91c1c;
    --status-ok-border: rgba(196, 5, 0, 0.38);
    --status-ok-bg: rgba(196, 5, 0, 0.10);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .desk {
    display: grid;
    grid-template-rows: var(--bar-h) 1fr;
    height: 100%;
  }

  /* ---- top bar: broadcast desk chrome ---- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 var(--inset-line) inset;
    z-index: 100000;
    position: relative;
  }
  .topbar::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--accent), #8b0000);
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
    font-weight: 650; letter-spacing: 0.06em;
    font-size: 12.5px;
    text-transform: none;
    white-space: nowrap;
    padding-left: 4px;
  }
  .logo .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 3px rgba(255, 59, 92, 0.18), 0 0 10px rgba(255, 59, 92, 0.55);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.92); }
  }
  .topbar .grow { flex: 1; min-width: 8px; }

  /* fixed top-left session strip (race / session / laps / clock) */
  .session-strip {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    max-width: min(440px, 38vw);
    flex: 0 1 auto;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    background: var(--status-bg);
    border: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
  }
  .session-strip .ss-meeting {
    font-weight: 650;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }
  .session-strip .ss-flag {
    flex-shrink: 0;
    height: 16px;
    width: auto;
    max-width: 24px;
    margin-left: 2px;
    border-radius: 2px;
    object-fit: cover;
    vertical-align: middle;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.22);
  }
  .session-strip .ss-flag[hidden] { display: none !important; }
  .session-strip .ss-session {
    color: var(--teal);
    font-weight: 600;
    flex-shrink: 0;
  }
  .session-strip .ss-sep {
    color: var(--muted2);
    opacity: 0.55;
    flex-shrink: 0;
  }
  .session-strip .ss-chip {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: var(--text);
    font-weight: 550;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.01em;
  }
  .session-strip .ss-chip.clock {
    color: var(--text);
    font-weight: 600;
  }
  .session-strip.empty .ss-meeting,
  .session-strip.empty .ss-session {
    color: var(--muted2);
    font-weight: 500;
  }
  @media (max-width: 1100px) {
    .session-strip { max-width: min(280px, 28vw); }
    .session-strip .ss-meeting { max-width: 96px; }
  }

  /* compact weather chips beside session capsule */
  .weather-strip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 1 auto;
    min-width: 0;
    max-width: min(560px, 48vw);
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--status-bg);
    border: 1px solid var(--border);
    white-space: nowrap;
    overflow: visible;
  }
  .weather-strip .ws-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    flex-shrink: 0;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    font-size: 11px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .weather-strip .ws-k {
    color: var(--muted);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.02em;
    opacity: 1;
  }
  .weather-strip .ws-v {
    color: var(--text);
    font-weight: 650;
  }
  .weather-strip .ws-chip.rain-warn {
    border-color: rgba(255, 107, 122, 0.45);
    background: rgba(255, 107, 122, 0.10);
  }
  .weather-strip .ws-chip.rain-warn .ws-v { color: var(--bad); }

  .weather-strip .ws-chip[data-ws="pressure"] {
    flex-shrink: 0;
  }
  .weather-strip .ws-chip[data-ws="pressure"] .ws-v {
    max-width: none;
    overflow: visible;
    text-overflow: clip;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .weather-strip.empty .ws-v { color: var(--muted2); font-weight: 500; }
  @media (max-width: 1280px) {
    .weather-strip { max-width: min(480px, 42vw); }
    .weather-strip .ws-chip[data-ws="humidity"],
    .weather-strip .ws-chip[data-ws="wind"] { display: none; }
  }
  @media (max-width: 980px) {
    .weather-strip { max-width: min(360px, 38vw); }
    .weather-strip .ws-chip[data-ws="track"] { display: none; }
  }

  /* compact track/flag status chip beside weather */
  .track-strip {
    display: flex;
    align-items: center;
    flex: 0 0 auto;
    min-width: 0;
    padding: 3px 4px;
    border-radius: 999px;
    background: var(--status-bg);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .track-strip .ts-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 160px;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.02em;
    color: var(--text);
    background: var(--btn-bg);
    border-color: var(--border);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-strip .ts-dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.18);
  }
  .track-strip .ts-label {
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .track-strip.empty .ts-chip {
    color: var(--muted2);
    font-weight: 500;
  }
  .track-strip.empty .ts-dot {
    background: var(--muted2);
    opacity: 0.55;
  }
  .track-strip.filled .ts-chip {
    /* fill color set inline from state.track */
    border-color: rgba(0,0,0,0.18);
  }
  .track-strip.filled .ts-dot {
    background: rgba(255,255,255,0.92);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
  }
  @media (max-width: 980px) {
    .track-strip .ts-chip { max-width: 110px; }
  }

  /* LIVE panel: URL + load/clear + board-data delay on ONE compact row */
  .live-toolbar {
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
    flex-wrap: nowrap;
    padding: 5px 8px;
    background: var(--panel-head);
    border-bottom: 1px solid var(--border);
    min-width: 0;
    z-index: 4;
  }
  .live-toolbar .stream-url {
    flex: 1 1 auto;
    min-width: 100px;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 10px; outline: none;
    font: inherit; font-size: 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .live-toolbar .stream-url::placeholder { color: var(--muted2); }
  .live-toolbar .stream-url:focus {
    border-color: rgba(225, 6, 0, 0.45);
    box-shadow: 0 0 0 3px var(--teal-dim);
  }
  .live-toolbar > button {
    padding: 4px 10px;
    font-size: 11.5px;
    flex-shrink: 0;
  }
  .live-toolbar .tb-sep {
    flex-shrink: 0;
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 2px;
  }
  .live-toolbar .delay-label {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.02em;
    color: var(--muted);
    white-space: nowrap;
  }
  .live-toolbar input[type="range"] {
    flex: 0 1 88px;
    min-width: 56px;
    max-width: 120px;
    height: 4px;
    accent-color: var(--teal);
    cursor: pointer;
  }
  .live-toolbar input[type="number"] {
    width: 44px;
    flex-shrink: 0;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 6px; outline: none;
    font: inherit; font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .live-toolbar input[type="number"]:focus {
    border-color: rgba(225, 6, 0, 0.45);
    box-shadow: 0 0 0 3px var(--teal-dim);
  }
  .live-toolbar .delay-unit {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--muted2);
  }
  .live-toolbar .delay-status {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--teal);
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--teal-dim);
    border: 1px solid rgba(225, 6, 0, 0.28);
    white-space: nowrap;
  }
  .live-toolbar .delay-status.warming {
    color: var(--warn);
    background: rgba(240, 180, 41, 0.12);
    border-color: rgba(240, 180, 41, 0.35);
  }
  .live-toolbar .delay-status.off {
    color: var(--muted);
    background: var(--btn-bg);
    border-color: var(--border);
  }
  .fpanel.live-panel.minimized .live-toolbar { display: none; }
  .fpanel.live-panel.live-toolbar-hidden .live-toolbar { display: none !important; }
  .p-head .win-btns button.live-url-tog {
    width: auto;
    min-width: 0;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .p-head .win-btns button.live-url-tog.on {
    color: var(--teal);
    background: var(--teal-dim);
    border-color: rgba(225, 6, 0, 0.28);
  }
  @media (max-width: 900px) {
    .live-toolbar { flex-wrap: wrap; }
    .live-toolbar .stream-url { flex: 1 1 100%; min-width: 0; }
  }
  button {
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.01em;
    transition: background .15s, border-color .15s, color .15s, filter .15s;
  }
  button:hover {
    background: var(--btn-hover);
    border-color: var(--border-hi);
    color: var(--btn-text-hover);
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
    font-weight: 650;
    box-shadow: 0 2px 12px rgba(225, 6, 0, 0.35);
  }
  button.primary:hover {
    color: #fff;
    filter: brightness(1.08);
    border-color: transparent;
  }
  .status {
    color: var(--muted); font-size: 11.5px; white-space: nowrap;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--status-bg);
    border: 1px solid var(--border);
  }
  .status.ok {
    color: var(--ok);
    border-color: var(--status-ok-border);
    background: var(--status-ok-bg);
  }
  .status.bad {
    color: var(--bad);
    border-color: rgba(255, 107, 122, 0.28);
    background: rgba(255, 107, 122, 0.08);
  }

  .stage {
    position: relative;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 55% at 50% 42%, var(--stage-glow) 0%, var(--bg-stage) 58%, var(--stage-edge) 100%);
  }

  /* ---- floating panels ---- */
  .fpanel {
    position: absolute;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r);
    min-width: 180px;
    min-height: 120px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    user-select: none;
    transition: box-shadow .15s, border-color .15s;
  }
  .fpanel.board-flags {
    min-height: 68px;
  }
  .fpanel.board-flags:not(.minimized) .p-body {
    flex: 1 1 auto;
    min-height: 0;
  }
  .fpanel::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, rgba(225,6,0,0.55), rgba(225,6,0,0.08));
    z-index: 6;
    pointer-events: none;
    opacity: 0.7;
  }
  .fpanel.active {
    border-color: rgba(225, 6, 0, 0.35);
    box-shadow: var(--shadow), 0 0 0 1px rgba(225, 6, 0, 0.12);
  }
  .fpanel.active::before { opacity: 1; background: var(--teal); }
  .fpanel.dragging {
    opacity: 0.92;
    border-color: rgba(225, 6, 0, 0.45);
    box-shadow: var(--shadow);
  }
  .fpanel.drop-target {
    border-color: rgba(225, 6, 0, 0.65) !important;
    box-shadow: 0 0 0 2px rgba(225, 6, 0, 0.35), var(--shadow);
  }
  .fpanel.drop-target::after {
    content: "交换位置";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    pointer-events: none;
    background: rgba(225, 6, 0, 0.95);
    color: #041016;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 8px 16px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .fpanel.live-panel.drop-target::after { content: "与直播交换"; }
  .fpanel.live-panel {
    background: var(--live-panel-bg);
    border-color: rgba(255, 59, 92, 0.22);
    min-width: 280px;
    min-height: 210px;
  }
  .fpanel.live-panel::before {
    background: linear-gradient(180deg, var(--live), rgba(225, 6, 0, 0.25));
    opacity: 1;
  }
  .fpanel.live-panel.active {
    border-color: rgba(255, 59, 92, 0.45);
    box-shadow: var(--shadow), 0 0 0 1px rgba(255, 59, 92, 0.15);
  }
  .fpanel.minimized {
    min-height: 0;
    height: auto !important;
  }
  .fpanel.minimized .p-body,
  .fpanel.minimized .resize-handle { display: none !important; }

  .p-head {
    display: flex; align-items: center; gap: 7px;
    height: var(--head-h);
    padding: 0 8px 0 12px;
    background: linear-gradient(180deg, var(--panel-elev), var(--panel-head));
    border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.02em;
    cursor: grab;
    flex-shrink: 0;
  }
  .p-head:active { cursor: grabbing; }
  .p-head .live-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--live);
    background: rgba(255, 59, 92, 0.12);
    border: 1px solid rgba(255, 59, 92, 0.28);
    border-radius: 999px;
    padding: 1px 8px 1px 6px;
  }
  .p-head .live-badge::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 6px var(--live);
  }
  .p-head .title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 120px;
    color: var(--text);
    font-weight: 650;
  }
  .p-head .tag {
    color: var(--muted2); font-weight: 500;
    font-size: 10px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    max-width: 72px;
    opacity: 0.75;
    font-family: "Noto Sans SC", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  /* Custom board-type dropdown (native <option> contrast is unreliable on Windows) */
  .board-dd {
    position: relative;
    flex-shrink: 0;
    max-width: 148px;

    if (detail) tip.push(detail);
    if (kinds.length) tip.push(kinds.join(' · '));
    if (t && t.level != null && tip.indexOf('L' + t.level) < 0) {
      // level is internal; only append if nothing else
      if (!tip.length) tip.push('level ' + t.level);
    }
    strip.title = tip.length ? tip.join(' · ') : '赛道旗语（来自 Director）';
  }

  function updateSessionStrip() {
    var strip = document.getElementById('sessionStrip');
    if (!strip) return;
    var r = (latestState && latestState.race) || {};
    var meeting = r.meeting || '';
    var session = r.session || '';
    var status = r.status || '';
    var remaining = r.remaining || '';
    var lap = r.lap;
    var total = r.totalLaps;
    var has = !!(meeting || session || remaining || (lap != null && lap !== 0) || (total != null && total !== 0) || status);
    strip.classList.toggle('empty', !has);
    var meetEl = document.getElementById('ssMeeting');
    var sessEl = document.getElementById('ssSession');
    var lapsEl = document.getElementById('ssLaps');
    var clockEl = document.getElementById('ssClock');
    var flagEl = document.getElementById('ssFlag');
    if (meetEl) meetEl.textContent = meeting || (has ? 'F1' : '等待赛会');
    if (flagEl) {
      var cc = meeting ? inferCountryCode(meeting, r.circuit) : '';
      var url = flagImgUrl(cc);
      if (url) {
        if (flagEl.getAttribute('src') !== url) flagEl.src = url;
        flagEl.alt = cc;
        flagEl.title = cc;
        flagEl.hidden = false;
        flagEl.setAttribute('aria-hidden', 'false');
      } else {
        flagEl.removeAttribute('src');
        flagEl.alt = '';
        flagEl.title = '';
        flagEl.hidden = true;
        flagEl.setAttribute('aria-hidden', 'true');
      }
    }
    if (sessEl) sessEl.textContent = session || (status || '—');
    if (lapsEl) {
      if (lap != null || total != null) {
        lapsEl.textContent = 'L ' + (lap != null ? lap : 0) + '/' + (total != null ? total : 0);
      } else {
        lapsEl.textContent = 'L —/—';
      }
    }
    if (clockEl) {
      if (remaining) {
        clockEl.textContent = remaining;
        clockEl.title = status ? ('状态：' + status) : '剩余时间';
      } else if (status) {
        clockEl.textContent = status;
        clockEl.title = '环节状态';
      } else {
        clockEl.textContent = '—';
        clockEl.title = '';
      }
    }
    var tip = [];
    if (meeting) tip.push(meeting);
    if (r.circuit) tip.push(r.circuit);
    if (session) tip.push(session);
    if (status) tip.push(status);
    if (remaining) tip.push('剩 ' + remaining);
    if (lap != null || total != null) tip.push('第 ' + (lap || 0) + '/' + (total || 0) + ' 圈');
    strip.title = tip.length ? tip.join(' · ') : '场次状态（来自 Director）';
  }

  function pushStateToAll() {
    updateSessionStrip();
    updateWeatherStrip();
    updateTrackStrip();
    Object.keys(panels).forEach(function (id) {
      var p = panels[id];
      if (!p || p.type !== 'board' || !p.el) return;
      pushStateToFrame(p.el.querySelector('iframe'));
    });
  }


  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    return (t === 'day') ? 'day' : 'night';
  }

  function pushThemeToFrame(iframe) {
    if (!iframe) return;
    var theme = currentTheme();
    try {
      var w = iframe.contentWindow;
      if (w && w.F1 && typeof w.F1.applyTheme === 'function') {
        w.F1.applyTheme(theme);
        try {
          if (typeof w.F1.relayout === 'function') w.F1.relayout();
        } catch (eRel) {}
      }
    } catch (e) {}
    // Always postMessage too: covers cross-origin and boards that only listen.
    try {
      iframe.contentWindow.postMessage({ type: 'f1-theme', theme: theme }, '*');
    } catch (e2) {}
  }

  function pushThemeToAll() {
    Object.keys(panels).forEach(function (id) {
      var p = panels[id];
      if (!p || p.type !== 'board' || !p.el) return;
      pushThemeToFrame(p.el.querySelector('iframe'));
    });
  }

  function applyTheme(theme, persist) {
    theme = (theme === 'day') ? 'day' : 'night';
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.getElementById('colorSchemeMeta');
    if (meta) meta.setAttribute('content', theme === 'day' ? 'light' : 'dark');
    var wrap = document.getElementById('themeToggle');
    if (wrap) wrap.setAttribute('data-active', theme);
    var dayBtn = document.getElementById('btnThemeDay');
    var nightBtn = document.getElementById('btnThemeNight');
    if (dayBtn) {
      dayBtn.classList.toggle('active', theme === 'day');
      dayBtn.setAttribute('aria-pressed', theme === 'day' ? 'true' : 'false');
    }
    if (nightBtn) {
      nightBtn.classList.toggle('active', theme === 'night');
      nightBtn.setAttribute('aria-pressed', theme === 'night' ? 'true' : 'false');
    }
    if (persist !== false) {
      try { localStorage.setItem(STORAGE_THEME, theme); } catch (e) {}
      if (typeof persistLayoutsToFile === 'function') persistLayoutsToFile(false);
    }
    pushThemeToAll();
  }

    function loadTheme() {
    var saved = 'night';
    var had = false;
    try {
      var v = localStorage.getItem(STORAGE_THEME);
      if (v === 'day' || v === 'night') { saved = v; had = true; }
    } catch (e) {}
    // First visit: persist night so boards/iframes share the same default.
    applyTheme(saved, !had);
  }

  function themeRevealRadius(x, y) {
    var w = window.innerWidth || 1;
    var h = window.innerHeight || 1;
    var maxX = Math.max(x, w - x);
    var maxY = Math.max(y, h - y);
    return Math.ceil(Math.sqrt(maxX * maxX + maxY * maxY));
  }

  function prefersReducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { return false; }
  }

  /** UI toggle: circular wipe from click; boot/preset/file still call applyTheme directly. */
  function setThemeFromUi(theme, evt) {
    theme = (theme === 'day') ? 'day' : 'night';
    if (currentTheme() === theme) return;
    var x = window.innerWidth / 2;
    var y = window.innerHeight / 2;
    if (evt && typeof evt.clientX === 'number' && typeof evt.clientY === 'number') {
      x = evt.clientX;
      y = evt.clientY;
    } else if (evt && evt.currentTarget && evt.currentTarget.getBoundingClientRect) {
      var r = evt.currentTarget.getBoundingClientRect();
      x = r.left + r.width / 2;
      y = r.top + r.height / 2;
    }
    var canVt = typeof document.startViewTransition === 'function' && !prefersReducedMotion();
    if (!canVt) {
      applyTheme(theme, true);
      return;
    }
    var radius = themeRevealRadius(x, y);
    document.documentElement.classList.add('theme-vt-active');
    var transition;
    try {
      transition = document.startViewTransition(function () {
        applyTheme(theme, true);
      });
    } catch (e) {
      document.documentElement.classList.remove('theme-vt-active');
      applyTheme(theme, true);
      return;
    }
    transition.ready.then(function () {
      document.documentElement.animate(
        {
          clipPath: [
            'circle(0px at ' + x + 'px ' + y + 'px)',
            'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'
          ]
        },
        {
          duration: 1000,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
          pseudoElement: '::view-transition-new(root)'
        }
      );
    }).catch(function () {});
    transition.finished.finally(function () {
      document.documentElement.classList.remove('theme-vt-active');
    });
  }

  function connectFeed() {
    if (feedEs) {
      try { feedEs.close(); } catch (e) {}
      feedEs = null;
    }
    try {
      feedEs = new EventSource(RC + '/api/events');
    } catch (e) {
      return;
    }
    // Open SSE = connected. Backend keeps the stream alive with ": ping"
    // comments when race data is quiet (no new "state" events); those comments
    // are invisible to JS, so we must NOT require state traffic for the green dot.
    feedEs.addEventListener('open', function () {
      setBoardFeedOk(true);
    });
    feedEs.addEventListener('state', function (ev) {
      try {
        ingestLiveState(JSON.parse(ev.data));
      } catch (e) {}
    });
    feedEs.addEventListener('error', function () {
      // EventSource auto-reconnects while readyState is CONNECTING (0).
      // Only treat CLOSED (2) as a real drop; checkHealth will re-open.
      if (feedEs && feedEs.readyState === 2) {
        setBoardFeedOk(false);
      }
    });
  }

  /** Force the panel iframe to actually navigate to a board.
   *  All /board/<id> URLs serve the same board.html; some browsers skip a
   *  real reload when only the path segment changes, so title/label update
   *  while the old board keeps painting. Recreate the iframe + cache-bust. */
  function syncBoardChrome(el, boardId) {
    var dd = el.querySelector('[data-board-select]');
    if (dd) {
      dd.setAttribute('data-value', boardId);
      var lab = dd.querySelector('.board-dd-label');
      if (lab) lab.textContent = boardLabel(boardId);
    }
    syncTimingColsTog(el, boardId);
    syncTrackmapHead(el, boardId);
  }

  /** Prefer in-place board switch (keeps JS/OpenF1 cache). Fall back to iframe recreate. */
  function applyBoardToPanel(el, boardId) {
    var body = el.querySelector('.p-body');
    if (!body) return;
    el.classList.toggle('board-flags', boardId === 'flags');
    var oldFrame = body.querySelector('iframe');

    function finishLive(iframe) {
      pushStateToFrame(iframe);
      pushThemeToFrame(iframe);
      if (boardId === 'trackmap') requestTrackmapUi(el);
      if (boardId === 'timing') pushTimingColsToFrame(el, loadTimingColsVis());
      syncBoardChrome(el, boardId);
    }

    if (oldFrame && oldFrame.getAttribute('data-board') === boardId) {
      finishLive(oldFrame);
      return;
    }

    // Same iframe document: switch renderer without reload (fast path for 赛道图).
    if (oldFrame) {
      try {
        var w = oldFrame.contentWindow;
        if (w && w.F1 && typeof w.F1.setBoard === 'function' && w.F1.setBoard(boardId)) {
          oldFrame.title = boardId;
          oldFrame.setAttribute('data-board', boardId);
          finishLive(oldFrame);
          return;
        }
      } catch (e) { /* cross-origin or old build — recreate below */ }
    }

    var iframe = document.createElement('iframe');
    iframe.title = boardId;
    iframe.setAttribute('data-board', boardId);
    iframe.onload = function () { finishLive(iframe); };
    iframe.src = boardUrl(boardId, true);
    if (oldFrame) {
      body.replaceChild(iframe, oldFrame);
    } else {
      body.appendChild(iframe);
    }
    syncBoardChrome(el, boardId);
  }

  function boardLabel(id) {
    for (var i = 0; i < BOARD_OPTS.length; i++) {
      if (BOARD_OPTS[i].id === id) return BOARD_OPTS[i].label;
    }
    return id;
  }

  function stageSize() {
    return { w: stage.clientWidth, h: stage.clientHeight };
  }

  function defaultLayout() {
    var s = stageSize();
    var W = Math.max(s.w, 900);
    var H = Math.max(s.h, 600);
    var g = 8;
    var sideW = Math.floor(Math.min(340, W * 0.26));
    var botH = Math.floor(Math.min(200, H * 0.28));
    var liveX = sideW + g;
    var liveY = g;
    var liveW = W - sideW * 2 - g * 3;
    var liveH = H - botH - g * 3;
    if (liveW < 320) liveW = Math.max(320, W - g * 2);
    if (liveH < 200) liveH = Math.max(200, H - botH - g * 2);

    return [
      { id: 'live', type: 'live', x: liveX, y: liveY, w: liveW, h: liveH, z: 20, minimized: false },
      { id: 'p1', type: 'board', board: 'timing',   x: g, y: g, w: sideW, h: Math.floor((liveH - g) / 2), z: 11, minimized: false },
      { id: 'p2', type: 'board', board: 'ring',     x: g, y: g + Math.floor((liveH - g) / 2) + g, w: sideW, h: Math.floor((liveH - g) / 2), z: 12, minimized: false },
      { id: 'p3', type: 'board', board: 'weather',  x: W - sideW - g, y: g, w: sideW, h: Math.floor((liveH - g) / 2), z: 13, minimized: false },
      { id: 'p4', type: 'board', board: 'tyres',    x: W - sideW - g, y: g + Math.floor((liveH - g) / 2) + g, w: sideW, h: Math.floor((liveH - g) / 2), z: 14, minimized: false },
      { id: 'p5', type: 'board', board: 'messages', x: g, y: H - botH - g, w: Math.floor((W - g * 4) / 3), h: botH, z: 15, minimized: false },
      { id: 'p6', type: 'board', board: 'fastest',  x: g * 2 + Math.floor((W - g * 4) / 3), y: H - botH - g, w: Math.floor((W - g * 4) / 3), h: botH, z: 16, minimized: false },
      { id: 'p7', type: 'board', board: 'session',  x: g * 3 + Math.floor((W - g * 4) / 3) * 2, y: H - botH - g, w: Math.floor((W - g * 4) / 3), h: botH, z: 17, minimized: false }
    ];
  }

  function panelH(p) {
    return p.minimized ? HEAD_H : p.h;
  }

  function panelBox(p) {
    return { x: p.x, y: p.y, w: p.w, h: panelH(p) };
  }

  function rectsOverlap(a, b, gap) {
    if (gap == null) gap = GAP;
    return !(a.x + a.w + gap <= b.x ||
             b.x + b.w + gap <= a.x ||
             a.y + a.h + gap <= b.y ||
             b.y + b.h + gap <= a.y);
  }

  function eachOther(id, fn) {
    Object.keys(panels).forEach(function (k) {
      if (k !== id) fn(panels[k]);
    });
  }

  function overlapsAny(st) {
    var box = panelBox(st);
    var hit = null;
    eachOther(st.id, function (o) {
      if (!hit && rectsOverlap(box, panelBox(o))) hit = o;
    });
    return hit;
  }

  function boardMinH(st) {
    if (st.type === 'live') return LIVE_MIN_H;
    if (st.board === 'flags') return FLAGS_MIN_H;
    return MIN_H;
  }

  function minSize(st) {
    return {
      w: st.type === 'live' ? LIVE_MIN_W : MIN_W,
      h: st.minimized ? HEAD_H : boardMinH(st)
    };
  }

  function clampToStage(st) {
    var s = stageSize();
    var m = minSize(st);
    var maxW = Math.max(m.w, s.w - GAP * 2);
    var maxH = Math.max(m.h, s.h - GAP * 2);
    st.w = Math.max(m.w, Math.min(st.w, maxW));
    if (st.minimized) st.h = HEAD_H;
    else st.h = Math.max(m.h, Math.min(st.h, maxH));
    var ph = panelH(st);
    st.x = Math.max(GAP, Math.min(st.x, Math.max(GAP, s.w - st.w - GAP)));
    st.y = Math.max(GAP, Math.min(st.y, Math.max(GAP, s.h - ph - GAP)));
    return st;
  }

  function clampPanel(st) {
    return clampToStage(st);
  }

  function notifyPanelContentResize(el) {
    if (!el) return;
    var iframe = el.querySelector('iframe');
    if (!iframe) return;
    try {
      var w = iframe.contentWindow;
      if (w && w.F1 && typeof w.F1.relayout === 'function') {
        w.F1.relayout();
        return;
      }
    } catch (e) {}
    try {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'f1-resize' }, '*');
      }
    } catch (e2) {}
  }

  function notifyAllContentResize() {
    Object.keys(panels).forEach(function (id) {
      notifyPanelContentResize(panels[id].el);
    });
  }

  var contentResizeTimer = null;
  function scheduleContentResize(el) {
    if (contentResizeTimer) clearTimeout(contentResizeTimer);
    contentResizeTimer = setTimeout(function () {
      contentResizeTimer = null;
      if (el) notifyPanelContentResize(el);
      else notifyAllContentResize();
    }, 60);
  }

  function applyGeom(el, st, opts) {
    // skipClamp: keep scaled/letterboxed coords (min-size + GAP clamp would
    // reopen gaps and fight uniform scale after a shrink).
    if (!opts || !opts.skipClamp) clampPanel(st);
    el.style.left = st.x + 'px';
    el.style.top = st.y + 'px';
    el.style.width = st.w + 'px';
    if (st.minimized) {
      el.style.height = HEAD_H + 'px';
      el.classList.add('minimized');
    } else {
      el.style.height = st.h + 'px';
      el.classList.remove('minimized');
    }
    el.style.zIndex = st.z;
    if (!opts || !opts.silentContent) scheduleContentResize(el);
  }

  /** Push st away from neighbors until no overlap, or restore origin. */
  function trySeparate(st, origin) {
    clampToStage(st);
    if (!overlapsAny(st)) return true;
    for (var iter = 0; iter < 48; iter++) {
      var hit = overlapsAny(st);
      if (!hit) return true;
      var a = panelBox(st);
      var b = panelBox(hit);
      var dx = (a.x + a.w / 2) - (b.x + b.w / 2);
      var dy = (a.y + a.h / 2) - (b.y + b.h / 2);
      var ox = (a.w + b.w) / 2 + GAP - Math.abs(dx);
      var oy = (a.h + b.h) / 2 + GAP - Math.abs(dy);
      if (ox <= 0 || oy <= 0) {
        st.x += (dx === 0 ? GAP : (dx > 0 ? 1 : -1));
        st.y += (dy === 0 ? GAP : (dy > 0 ? 1 : -1));
      } else if (ox < oy) {
        st.x += (dx >= 0 ? 1 : -1) * Math.ceil(ox);
      } else {
        st.y += (dy >= 0 ? 1 : -1) * Math.ceil(oy);
      }
      clampToStage(st);
    }
    if (!overlapsAny(st)) return true;
    if (origin) {
      st.x = origin.x; st.y = origin.y; st.w = origin.w; st.h = origin.h;
      st.minimized = origin.minimized; st._prevH = origin._prevH;
      clampToStage(st);
    }
    return !overlapsAny(st);
  }

  /** Iteratively untangle all panels (after window scale / load). */
  function resolveAllOverlaps() {
    var ids = Object.keys(panels).sort(function (a, b) {
      var pa = panels[a], pb = panels[b];
      if (pa.type === 'live' && pb.type !== 'live') return -1;
      if (pb.type === 'live' && pa.type !== 'live') return 1;
      return (pb.w * panelH(pb)) - (pa.w * panelH(pa));
    });
    for (var pass = 0; pass < 40; pass++) {
      var any = false;
      for (var i = 0; i < ids.length; i++) {
        var st = panels[ids[i]];
        var hit = overlapsAny(st);
        if (!hit) continue;
        any = true;
        var move = st;
        if (st.type === 'live') move = hit;
        else if (hit.type !== 'live' && (hit.w * panelH(hit) < st.w * panelH(st))) move = hit;
        var other = (move === st) ? hit : st;
        var a = panelBox(move);
        var b = panelBox(other);
        var dx = (a.x + a.w / 2) - (b.x + b.w / 2);
        var dy = (a.y + a.h / 2) - (b.y + b.h / 2);
        var ox = (a.w + b.w) / 2 + GAP - Math.abs(dx);
        var oy = (a.h + b.h) / 2 + GAP - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (ox < oy) move.x += (dx >= 0 ? 1 : -1) * Math.ceil(ox);
          else move.y += (dy >= 0 ? 1 : -1) * Math.ceil(oy);
        } else {
          move.x += GAP; move.y += GAP;
        }
        clampToStage(move);
        applyGeom(move.el, move, { silentContent: true });
      }
      if (!any) break;
    }
    notifyAllContentResize();
  }

  /** Clamp growing panel against a neighbor that cannot shrink further.
   *  Only apply the axis that the neighbor actually blocks — corner dirs
   *  (e.g. se) must not let a right-side panel collapse our height, or a
   *  bottom panel collapse our width.
   */
  function clampSelfToNeighbor(st, hit, dir) {
    var m = minSize(st);
    var a = panelBox(st);
    var o = panelBox(hit);
    var acx = a.x + a.w / 2, acy = a.y + a.h / 2;
    var ocx = o.x + o.w / 2, ocy = o.y + o.h / 2;
    if (dir.indexOf('e') >= 0 && sharesPerpEdge(a, o, 'e') && ocx >= acx - 1) {
      st.w = Math.min(st.w, Math.max(m.w, o.x - GAP - st.x));
    }
    if (dir.indexOf('w') >= 0 && sharesPerpEdge(a, o, 'w') && ocx <= acx + 1) {
      var right = st.x + st.w;
      var nx = Math.max(st.x, o.x + o.w + GAP);
      st.x = nx;
      st.w = Math.max(m.w, right - st.x);
    }
    if (dir.indexOf('s') >= 0 && sharesPerpEdge(a, o, 's') && ocy >= acy - 1) {
      st.h = Math.min(st.h, Math.max(m.h, o.y - GAP - st.y));
    }
    if (dir.indexOf('n') >= 0 && sharesPerpEdge(a, o, 'n') && ocy <= acy + 1) {
      var bottom = st.y + st.h;
      var ny = Math.max(st.y, o.y + o.h + GAP);
      st.y = ny;
      st.h = Math.max(m.h, bottom - st.y);
    }
    st.w = Math.max(m.w, st.w);
    st.h = Math.max(m.h, st.h);
  }

  /** True if A and B overlap on the axis perpendicular to the growth dir. */
  function sharesPerpEdge(a, b, dir) {
    if (dir.indexOf('e') >= 0 || dir.indexOf('w') >= 0) {
      return !(a.y + a.h <= b.y || b.y + b.h <= a.y);
    }
    if (dir.indexOf('s') >= 0 || dir.indexOf('n') >= 0) {
      return !(a.x + a.w <= b.x || b.x + b.w <= a.x);
    }
    return true;
  }

  /**
   * Compress hit along the shared edge so st can keep growing.
   * Returns true if hit geometry changed.
   */
  function compressNeighborAlongDir(st, hit, dir) {
    var om = minSize(hit);
    var changed = false;
    var a = panelBox(st);
    var b = panelBox(hit);
    var acx = a.x + a.w / 2, acy = a.y + a.h / 2;
    var bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;

    // East: grow right → shrink or push neighbor from its left
    if (dir.indexOf('e') >= 0 && sharesPerpEdge(a, b, 'e') && bcx >= acx - 1) {
      var need = a.x + a.w + GAP;
      if (hit.x < need) {
        var right = hit.x + hit.w;
        var avail = right - need;
        if (avail >= om.w) {
          hit.x = need;
          hit.w = avail;
        } else {
          // Already at min width: push the whole panel further along growth
          hit.w = om.w;
          hit.x = need;
        }
        changed = true;
      }
    }
    // West: grow left → shrink or push neighbor from its right
    if (dir.indexOf('w') >= 0 && sharesPerpEdge(a, b, 'w') && bcx <= acx + 1) {
      var limit = a.x - GAP;
      if (hit.x + hit.w > limit) {
        var left = hit.x;
        var availW = limit - left;
        if (availW >= om.w) {
          hit.w = availW;
        } else {
          hit.w = om.w;
          hit.x = Math.max(GAP, limit - om.w);
        }
        changed = true;
      }
    }
    // South: grow down → shrink or push neighbor from its top
    if (dir.indexOf('s') >= 0 && !hit.minimized && sharesPerpEdge(a, b, 's') && bcy >= acy - 1) {
      var needY = a.y + a.h + GAP;
      if (hit.y < needY) {
        var bottom = hit.y + hit.h;
        var availH = bottom - needY;
        if (availH >= om.h) {
          hit.y = needY;
          hit.h = availH;
        } else {
          hit.h = om.h;
          hit.y = needY;
        }
        changed = true;
      }
    }
    // North: grow up → shrink or push neighbor from its bottom
    if (dir.indexOf('n') >= 0 && !hit.minimized && sharesPerpEdge(a, b, 'n') && bcy <= acy + 1) {
      var limitY = a.y - GAP;
      if (hit.y + hit.h > limitY) {
        var top = hit.y;
        var availN = limitY - top;
        if (availN >= om.h) {
          hit.h = availN;
        } else {
          hit.h = om.h;
          hit.y = Math.max(GAP, limitY - om.h);
        }
        changed = true;
      }
    }

    if (changed) {
      var hm = minSize(hit);
      hit.w = Math.max(hm.w, hit.w);
      hit.h = Math.max(hm.h, hit.h);
      clampToStage(hit);
    }
    return changed;
  }

  function collectOverlaps(st) {
    var list = [];
    var box = panelBox(st);
    eachOther(st.id, function (o) {
      if (rectsOverlap(box, panelBox(o))) list.push(o);
    });
    return list;
  }

  /**
   * While enlarging st, compress neighbors along the shared edge instead of
   * blocking growth. If a neighbor hits its min size, clamp st.
   * Returns map of touched panels.
   */
  function clampResizeAgainstOthers(st, dir) {
    var m = minSize(st);
    var touched = {};

    for (var guard = 0; guard < 48; guard++) {
      var hits = collectOverlaps(st);
      if (!hits.length) break;

      var progress = false;
      for (var i = 0; i < hits.length; i++) {
        var hit = hits[i];
        var before = { x: hit.x, y: hit.y, w: hit.w, h: hit.h };
        var moved = compressNeighborAlongDir(st, hit, dir);
        touched[hit.id] = hit;

        if (moved) {
          progress = true;
          // Chain: compressed panel may now overlap another further along growth
          var chainHits = [];
          eachOther(hit.id, function (o) {
            if (o.id !== st.id && rectsOverlap(panelBox(hit), panelBox(o))) chainHits.push(o);
          });
          for (var c = 0; c < chainHits.length; c++) {
            var ch = chainHits[c];
            if (compressNeighborAlongDir(hit, ch, dir)) {
              touched[ch.id] = ch;
              progress = true;
            }
          }
        }

        // Still colliding with this hit — neighbor at min or not on growth side
        if (rectsOverlap(panelBox(st), panelBox(hit))) {
          var unchanged = before.x === hit.x && before.y === hit.y &&
            before.w === hit.w && before.h === hit.h;
          clampSelfToNeighbor(st, hit, dir);
          if (unchanged) progress = true; // st changed at least
        }
      }

      if (!collectOverlaps(st).length) break;
      if (!progress) {
        // Force-clamp against every remaining overlap then stop
        collectOverlaps(st).forEach(function (h) {
          clampSelfToNeighbor(st, h, dir);
          touched[h.id] = h;
        });
        break;
      }
    }

    st.w = Math.max(m.w, st.w);
    st.h = Math.max(m.h, st.h);
    clampToStage(st);

    Object.keys(touched).forEach(function (id) {
      var p = touched[id];
      clampToStage(p);
      applyGeom(p.el, p, { silentContent: true });
    });
    return touched;
  }

  function findFreeSpot(w, h) {
    var s = stageSize();
    var step = 24;
    for (var y = GAP; y + h <= s.h - GAP; y += step) {
      for (var x = GAP; x + w <= s.w - GAP; x += step) {
        var trial = { id: '__tmp', x: x, y: y, w: w, h: h, minimized: false, type: 'board' };
        var ok = true;
        Object.keys(panels).forEach(function (id) {
          if (ok && rectsOverlap(panelBox(trial), panelBox(panels[id]))) ok = false;
        });
        if (ok) return { x: x, y: y };
      }
    }
    return { x: GAP, y: GAP };
  }

  function loadTimingColsVis() {
    var vis = {};
    var i;
    for (i = 0; i < TIMING_COLS_DEF.length; i++) vis[TIMING_COLS_DEF[i].id] = true;
    try {
      var raw = localStorage.getItem(TIMING_COLS_STORAGE);
      if (!raw) {
        try { localStorage.setItem(TIMING_COLS_VER_KEY, TIMING_COLS_VER); } catch (e0) {}
        return vis;
      }
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return vis;
      var chosen = {};
      for (i = 0; i < arr.length; i++) chosen[arr[i]] = true;
      for (i = 0; i < TIMING_COLS_DEF.length; i++) {
        var c = TIMING_COLS_DEF[i];
        vis[c.id] = c.always ? true : !!chosen[c.id];
      }
      // Migrate old separate 圈 (laps) into 轮胎 (tyre).
      if (chosen.laps && !chosen.tyre) vis.tyre = true;
      if (!vis.pos && !vis.who) { vis.pos = true; vis.who = true; }
      try {
        if (localStorage.getItem(TIMING_COLS_VER_KEY) !== TIMING_COLS_VER) {
          vis.status = true;
          localStorage.setItem(TIMING_COLS_VER_KEY, TIMING_COLS_VER);
          var outMig = [];
          for (var mi = 0; mi < TIMING_COLS_DEF.length; mi++) {
            var mc = TIMING_COLS_DEF[mi];
            if (mc.always || vis[mc.id]) outMig.push(mc.id);
          }
          localStorage.setItem(TIMING_COLS_STORAGE, JSON.stringify(outMig));
        }
      } catch (eVer) {}
      return vis;
    } catch (e) {
      return vis;
    }
  }

  function timingColsArrayFromVis(vis) {
    var out = [];
    for (var i = 0; i < TIMING_COLS_DEF.length; i++) {
      var c = TIMING_COLS_DEF[i];
      if (c.always || (vis && vis[c.id])) out.push(c.id);
    }
    if (out.indexOf('pos') < 0) out.unshift('pos');
    if (out.indexOf('who') < 0) out.splice(1, 0, 'who');
    return out;
  }

  function pushTimingColsToAllBoards() {

      if ((p.board || '') === 'timing') pushTimingColsToFrame(p.el, vis);

  function applyTimingColumnsPref(arr) {
    if (!Array.isArray(arr) || !arr.length) return false;
    var cleaned = [];
    var seen = {};
    for (var i = 0; i < arr.length; i++) {
      var id = String(arr[i] || '');
      if (!id || seen[id]) continue;
      seen[id] = true;
      cleaned.push(id);
    }
    if (!seen.pos) cleaned.unshift('pos');
    if (!seen.who) cleaned.splice(cleaned.indexOf('pos') >= 0 ? 1 : 0, 0, 'who');
    // Drop legacy laps; tyre column already carries stint laps.
    cleaned = cleaned.filter(function (id) { return id !== 'laps'; });
    try { localStorage.setItem(TIMING_COLS_STORAGE, JSON.stringify(cleaned)); } catch (e) {}
    pushTimingColsToAllBoards();
    return true;
  }

  function createBoardPanel(st) {

      '<div class="p-head" data-drag>' +
