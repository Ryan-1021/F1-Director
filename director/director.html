<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark" id="colorSchemeMeta">
<title>F1 导播台 · Director</title>
<script>
(function () {
  var DIRECTOR_TITLE_BASE = 'F1 导播台 · Director';
  function directorShortVersion(raw) {
    var s = String(raw == null ? '' : raw).replace(/^\uFEFF/, '').trim();
    var plus = s.indexOf('+');
    if (plus >= 0) s = s.slice(0, plus);
    s = s.trim();
    if (!s) return '';
    if (s.charAt(0) === 'v' || s.charAt(0) === 'V') s = s.slice(1);
    return s;
  }
  function directorWindowTitle(raw) {
    var short = directorShortVersion(raw);
    return short ? DIRECTOR_TITLE_BASE + ' · v' + short : DIRECTOR_TITLE_BASE;
  }
  function applyDirectorWindowTitle(raw) {
    document.title = directorWindowTitle(raw);
  }
  try {
    fetch('VERSION', { cache: 'no-store' }).then(function (res) {
      return res.ok ? res.text() : '';
    }).then(function (text) {
      if (text) applyDirectorWindowTitle(text);
    }).catch(function () {});
  } catch (e0) {}
})();
</script>
<link rel="stylesheet" href="director.css">
</head>
<body>
<div class="desk">
  <header class="topbar">
    <div class="logo"><span class="dot"></span> F1 导播台</div>
    <div class="session-strip empty" id="sessionStrip" title="场次状态（来自 Director）" aria-live="polite">
      <span class="ss-meeting" id="ssMeeting">等待赛会</span>
      <img class="ss-flag" id="ssFlag" hidden alt="" width="24" height="16" decoding="async" aria-hidden="true">
      <span class="ss-sep">·</span>
      <span class="ss-session" id="ssSession">—</span>
      <span class="ss-chip" id="ssLaps">L —/—</span>
      <span class="ss-chip clock" id="ssClock">—</span>
    </div>
    <div class="weather-strip empty" id="weatherStrip" title="天气" aria-live="polite">
      <span class="ws-chip" data-ws="air" id="wsAir"><span class="ws-k">气</span><span class="ws-v">—</span></span>
      <span class="ws-chip" data-ws="track" id="wsTrack"><span class="ws-k">道</span><span class="ws-v">—</span></span>
      <span class="ws-chip" data-ws="humidity" id="wsHumidity"><span class="ws-k">湿</span><span class="ws-v">—</span></span>
      <span class="ws-chip" data-ws="wind" id="wsWind"><span class="ws-k">风</span><span class="ws-v">—</span></span>
      <span class="ws-chip" data-ws="pressure" id="wsPressure"><span class="ws-k">压</span><span class="ws-v">—</span></span>
      <span class="ws-chip" data-ws="rain" id="wsRain"><span class="ws-k">雨</span><span class="ws-v">—</span></span>
    </div>
    <div class="track-strip empty" id="trackStrip" title="赛道旗语（来自 Director）" aria-live="polite">
      <span class="ts-chip" id="tsChip"><span class="ts-dot" id="tsDot" aria-hidden="true"></span><span class="ts-label" id="tsLabel">—</span></span>
    </div>
    <div class="grow"></div>
    <div class="theme-toggle" id="themeToggle" role="group" aria-label="主题" data-active="night">
      <span class="theme-toggle-pill" aria-hidden="true"></span>
      <button type="button" data-theme="day" id="btnThemeDay" title="白天" aria-label="白天" aria-pressed="false"><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"/></svg></button>
      <button type="button" data-theme="night" id="btnThemeNight" title="夜晚" aria-label="夜晚" aria-pressed="true"><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.2 14.1A7.8 7.8 0 0 1 9.9 3.8 7.6 7.6 0 1 0 20.2 14.1z"/></svg></button>
    </div>
    <button id="btnAddPanel" type="button" title="新增一块浮动看板">添加面板</button>
    <button id="btnLayoutMenu" type="button" title="保存、恢复或重置布局" aria-haspopup="menu" aria-expanded="false">布局 ▾</button>
    <button id="btnLayoutLock" type="button" title="锁定布局（防止拖动/缩放/增删）" aria-label="锁定布局" aria-pressed="false">
      <svg class="lock-icon lock-icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 11V7a4 4 0 0 1 7.5-1.9M8 11H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/><rect x="9" y="14" width="6" height="4" rx="1" fill="currentColor" opacity="0.35"/></svg>
      <svg class="lock-icon lock-icon-locked" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 11V7a4 4 0 0 1 8 0v4M8 11H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/><rect x="9" y="14" width="6" height="4" rx="1" fill="currentColor"/></svg>
    </button>
    <span class="status" id="rcStatus">Director：正在连接服务…</span>
    <button id="btnOpenMain" type="button" title="在新窗口打开完整主界面">主界面</button>
    <button id="btnReloadAll" type="button">刷新看板</button>
  </header>

  <main class="stage" id="stage">
    <div class="hint-bar">拖到另一块上松开 = 交换 · 拖到空白处自动避让（不重叠） · 拖边缘放大时邻块沿共享边自动缩小 · 窗口缩放按比例适配</div>
  </main>
</div>
<script src="director-app.js"></script>
</body>
</html>
