  function bindPanel(st, el, opts) {
    panels[st.id] = st;
    st.el = el;
    applyGeom(el, st, opts);

    el.addEventListener('mousedown', function () {
      bringToFront(st.id);
    });

    var head = el.querySelector('[data-drag]');
    head.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      if (e.target.closest('.board-dd') || e.target.closest('button') || e.target.closest('.timing-cols-tog')) return;
      startDrag(st, e);
    });

    var colsBtn = el.querySelector('[data-action="timing-cols"]');
    if (colsBtn) {
      colsBtn.addEventListener('mousedown', function (e) { e.stopPropagation(); });
      colsBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        e.preventDefault();
        openTimingColsMenu(st, el, colsBtn);
      });
      syncTimingColsTog(el, st.board || 'timing');
    }

    var tmHead = el.querySelector('[data-tm-head]');
    if (tmHead) {
      tmHead.addEventListener('mousedown', function (e) {
        if (e.target.closest('button') || e.target.closest('.tm-tool')) e.stopPropagation();
      });
      var tmTools = tmHead.querySelector('.tm-head-tools');
      if (tmTools) {
        tmTools.addEventListener('click', function (e) {
          var btn = e.target && e.target.closest ? e.target.closest('[data-tm-rot]') : null;
          if (!btn) return;
          e.stopPropagation();
          e.preventDefault();
          pushTrackmapRot(el, Number(btn.getAttribute('data-tm-rot')) || 0);
        });
      }
      syncTrackmapHead(el, st.board || 'timing');
    }

    el.querySelectorAll('.resize-handle').forEach(function (h) {
      h.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        e.stopPropagation();
        startResize(st, h.getAttribute('data-dir'), e);
      });
    });

    var minBtn = el.querySelector('[data-action="min"]');
    if (minBtn) {
      minBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (layoutLocked) return;
        if (st.minimized) {
          st.minimized = false;
          if (st._prevH) st.h = st._prevH;
          applyGeom(el, st, { silentContent: true });
          trySeparate(st, null);
          applyGeom(el, st);
        } else {
          st._prevH = st.h;
          st.minimized = true;
          applyGeom(el, st);
        }
        saveLayout();
      });
    }

    var closeBtn = el.querySelector('[data-action="close"]');
    if (closeBtn) {
      closeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (layoutLocked) return;
        el.remove();
        delete panels[st.id];
        saveLayout();
      });
    }

    var dd = el.querySelector('[data-board-select]');
    if (dd) {
      // Keep dropdown interaction from starting a panel drag
      dd.addEventListener('mousedown', function (e) { e.stopPropagation(); });
      dd.addEventListener('click', function (e) {
        e.stopPropagation();
        e.preventDefault();
        openBoardDd(st, el, dd);
      });
    }
  }

  function setInteracting(on) {
    interacting = on;
    stage.classList.toggle('interacting', on);
  }

  function clearDropHighlights() {
    Object.keys(panels).forEach(function (id) {
      panels[id].el.classList.remove('drop-target');
    });
  }

  function panelHitHeight(p) {
    return panelH(p);
  }

  /** Find topmost other panel whose slot contains stage-local point. */
  function findSwapTarget(stageX, stageY, excludeId) {
    var best = null;
    var bestZ = -1;
    Object.keys(panels).forEach(function (id) {
      if (id === excludeId) return;
      var p = panels[id];
      var ph = panelHitHeight(p);
      if (stageX >= p.x && stageX <= p.x + p.w && stageY >= p.y && stageY <= p.y + ph) {
        if ((p.z || 0) > bestZ) {
          bestZ = p.z || 0;
          best = p;
        }
      }
    });
    return best;
  }

  function swapSlots(a, b) {
    var ax = a.x, ay = a.y, aw = a.w, ah = a.h;
    var amin = !!a.minimized, aprev = a._prevH;
    a.x = b.x; a.y = b.y; a.w = b.w; a.h = b.h;
    a.minimized = !!b.minimized; a._prevH = b._prevH;
    b.x = ax; b.y = ay; b.w = aw; b.h = ah;
    b.minimized = amin; b._prevH = aprev;
    applyGeom(a.el, a);
    applyGeom(b.el, b);
  }

  function startDrag(st, e) {
    if (layoutLocked) {
      flashLayoutMenuBtn('请先解锁');
      return;
    }
    e.preventDefault();
    bringToFront(st.id);
    setInteracting(true);
    st.el.classList.add('dragging');
    var stageRect = stage.getBoundingClientRect();
    var ox = e.clientX - stageRect.left - st.x;
    var oy = e.clientY - stageRect.top - st.y;
    var origin = { x: st.x, y: st.y, w: st.w, h: st.h, minimized: !!st.minimized, _prevH: st._prevH };
    var hoverTarget = null;

    function pointerOnStage(ev) {
      var r = stage.getBoundingClientRect();
      return { x: ev.clientX - r.left, y: ev.clientY - r.top };
    }

    function move(ev) {
      var pt = pointerOnStage(ev);
      st.x = pt.x - ox;
      st.y = pt.y - oy;
      applyGeom(st.el, st, { silentContent: true });

      // Hit-test against other panels' *current* slots.
      // While we float the dragged panel, temporarily restore origin for hit geometry
      // of the dragged id is skipped; targets use their live slots (unchanged).
      var t = findSwapTarget(pt.x, pt.y, st.id);
      if (t !== hoverTarget) {
        clearDropHighlights();
        hoverTarget = t;
        if (hoverTarget) hoverTarget.el.classList.add('drop-target');
      }
    }
    function up(ev) {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      st.el.classList.remove('dragging');
      clearDropHighlights();
      setInteracting(false);

      var pt = pointerOnStage(ev);
      var target = findSwapTarget(pt.x, pt.y, st.id);
      if (target) {
        // Put dragged panel back to origin first, then swap slots with target
        st.x = origin.x; st.y = origin.y; st.w = origin.w; st.h = origin.h;
        st.minimized = origin.minimized; st._prevH = origin._prevH;
        swapSlots(st, target);
        notifyPanelContentResize(st.el);
        notifyPanelContentResize(target.el);
      } else {
        // Free place with collision resolve; snap back if no room
        trySeparate(st, origin);
        applyGeom(st.el, st);
      }
      saveLayout();
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  function startResize(st, dir, e) {
    if (layoutLocked) {
      flashLayoutMenuBtn('请先解锁');
      return;
    }
    e.preventDefault();
    bringToFront(st.id);
    if (st.minimized) return;
    setInteracting(true);
    var startX = e.clientX, startY = e.clientY;
    var sx = st.x, sy = st.y, sw = st.w, sh = st.h;
    var minW = st.type === 'live' ? LIVE_MIN_W : MIN_W;
    var minH = st.minimized ? HEAD_H : boardMinH(st);
    // Snapshot every panel at gesture start so each mousemove can restore
    // neighbors and re-apply push-shrink from a clean baseline (elastic).
    var origins = {};
    Object.keys(panels).forEach(function (id) {
      var p = panels[id];
      origins[id] = { x: p.x, y: p.y, w: p.w, h: p.h, minimized: !!p.minimized };
    });
    var touched = {};

    function restoreOthers() {
      Object.keys(origins).forEach(function (id) {
        if (id === st.id) return;
        var p = panels[id];
        if (!p) return;
        var o = origins[id];
        p.x = o.x; p.y = o.y; p.w = o.w; p.h = o.h; p.minimized = o.minimized;
      });
    }

    function move(ev) {
      var dx = ev.clientX - startX;
      var dy = ev.clientY - startY;
      var x = sx, y = sy, w = sw, h = sh;
      if (dir.indexOf('e') >= 0) w = sw + dx;
      if (dir.indexOf('s') >= 0) h = sh + dy;
      if (dir.indexOf('w') >= 0) { w = sw - dx; x = sx + dx; }
      if (dir.indexOf('n') >= 0) { h = sh - dy; y = sy + dy; }
      if (w < minW) {
        if (dir.indexOf('w') >= 0) x = sx + sw - minW;
        w = minW;
      }
      if (h < minH) {
        if (dir.indexOf('n') >= 0) y = sy + sh - minH;
        h = minH;
      }
      restoreOthers();
      st.x = x; st.y = y; st.w = w; st.h = h;
      touched = clampResizeAgainstOthers(st, dir) || {};
      // Re-apply geom for any neighbor that was restored but not in touched
      Object.keys(origins).forEach(function (id) {
        if (id === st.id) return;
        if (!touched[id] && panels[id]) {
          applyGeom(panels[id].el, panels[id], { silentContent: true });
        }
      });
      applyGeom(st.el, st, { silentContent: true });
    }
    function up() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      setInteracting(false);
      // Do not snap back to gesture start — that felt like the live panel
      // "auto-shrinking". Re-clamp against neighbors; only nudge position.
      if (overlapsAny(st)) {
        clampResizeAgainstOthers(st, dir);
        if (overlapsAny(st)) trySeparate(st, null);
        applyGeom(st.el, st);
      }
      notifyPanelContentResize(st.el);
      Object.keys(touched).forEach(function (id) {
        if (panels[id]) notifyPanelContentResize(panels[id].el);
      });
      // Also refresh neighbors that were restored to origin (may have been touched earlier)
      Object.keys(origins).forEach(function (id) {
        if (id !== st.id && panels[id] && !touched[id]) {
          notifyPanelContentResize(panels[id].el);
        }
      });
      saveLayout();
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  function serialize() {
    return Object.keys(panels).map(function (id) {
      var p = panels[id];
      var o = {
        id: p.id, type: p.type,
        x: p.x, y: p.y, w: p.w, h: p.h, z: p.z,
        minimized: !!p.minimized
      };
      if (p.type === 'board') o.board = p.board;
      if (p._prevH) o._prevH = p._prevH;
      return o;
    });
  }

  function rememberViewport() {
    var s = stageSize();
    lastViewport = { w: s.w, h: s.h };
  }

  function currentLayoutPlain() {
    var s = stageSize();
    if (s.w > 0 && s.h > 0) lastViewport = { w: s.w, h: s.h };
    return {
      vw: lastViewport.w || 0,
      vh: lastViewport.h || 0,
      panels: serialize()
    };
  }

  function buildLayoutsFilePayload() {
    var theme = document.documentElement.getAttribute('data-theme') || 'night';
    var streamUrl = '';
    try {
      var input = document.getElementById('streamUrl');
      streamUrl = (input && input.value) || localStorage.getItem(STORAGE_URL) || '';
    } catch (e) {}
    var liveToolbarHidden = false;
    try {
      liveToolbarHidden = localStorage.getItem(STORAGE_LIVE_TB) === '1';
    } catch (e) {}
    var curPlain = currentLayoutPlain();
    // Locked: persist the pre-scale baseline so window size never rewrites layouts.json.
    if (layoutLocked && layoutBaseline && layoutBaseline.panels && layoutBaseline.panels.length) {
      curPlain = copyLayoutPlain(layoutBaseline);
    }
    return {
      version: 1,
      current: curPlain,
      presets: presetsCache && typeof presetsCache === 'object' ? presetsCache : {},
      theme: theme === 'day' ? 'day' : 'night',
      streamUrl: streamUrl || '',
      liveToolbarHidden: !!liveToolbarHidden,
      layoutLocked: !!layoutLocked,
      timingColumns: timingColsArrayFromVis(loadTimingColsVis())
    };
  }

  function persistLayoutsToFile(immediate) {
    function flush() {
      layoutsPersistTimer = null;
      var payload = buildLayoutsFilePayload();
      try {
        localStorage.setItem(STORAGE_LAYOUT, JSON.stringify(payload.current));
        localStorage.setItem(STORAGE_PRESETS, JSON.stringify(payload.presets || {}));
        if (payload.theme) localStorage.setItem(STORAGE_THEME, payload.theme);
        if (payload.streamUrl) localStorage.setItem(STORAGE_URL, payload.streamUrl);
        localStorage.setItem(STORAGE_LIVE_TB, payload.liveToolbarHidden ? '1' : '0');
        localStorage.setItem(STORAGE_LAYOUT_LOCK, payload.layoutLocked ? '1' : '0');
        if (payload.timingColumns && payload.timingColumns.length) {
          localStorage.setItem(TIMING_COLS_STORAGE, JSON.stringify(payload.timingColumns));
        }
      } catch (e) {}
      if (!layoutsHydrated) return;
      var body = JSON.stringify(payload);
      fetch(LAYOUTS_API, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: body,
        cache: 'no-store'
      }).then(function (r) {
        layoutsFileOk = !!r.ok;
        return r.ok ? r.json().catch(function () { return {}; }) : null;
      }).catch(function () {
        layoutsFileOk = false;
      });
    }
    if (layoutsPersistTimer) {
      clearTimeout(layoutsPersistTimer);
      layoutsPersistTimer = null;
    }
    if (immediate) flush();
    else layoutsPersistTimer = setTimeout(flush, 350);
  }

  function saveLayout() {
    try {
      var cur = currentLayoutPlain();
      // Unlocked edits / resize become the new canonical baseline.
      if (!layoutLocked) setLayoutBaselineFromPlain(cur);
      localStorage.setItem(STORAGE_LAYOUT, JSON.stringify(cur));
    } catch (e) {}
    persistLayoutsToFile(false);
  }

  function copyLayoutPlain(src) {
    if (!src || !Array.isArray(src.panels)) return null;
    return {
      vw: src.vw || 0,
      vh: src.vh || 0,
      panels: src.panels.map(function (p) {
        var o = {
          id: p.id,
          type: p.type,
          x: p.x, y: p.y, w: p.w, h: p.h,
          z: p.z,
          minimized: !!p.minimized
        };
        if (p.board) o.board = p.board;
        if (p._prevH) o._prevH = p._prevH;
        return o;
      })
    };
  }

  function setLayoutBaselineFromPlain(plain) {
    layoutBaseline = copyLayoutPlain(plain);
  }

  function ensureLiveInList(list) {
    list = (list || []).slice();
    var hasLive = list.some(function (p) { return p.type === 'live' || p.id === 'live'; });
    if (!hasLive) list.unshift(defaultLayout()[0]);
    return list;
  }

  /** Uniform fit of a design viewport into the stage (letterbox).
   *  Same scale on X/Y so relative gaps between panels match the saved layout;
   *  empty margin on the unused axis is intentional. */
  function layoutScalePlan(fromW, fromH, toW, toH) {
    if (!fromW || !fromH || !toW || !toH) return null;
    if (fromW === toW && fromH === toH) return { s: 1, ox: 0, oy: 0 };
    var sx = toW / fromW;
    var sy = toH / fromH;
    var s = Math.min(sx, sy);
    if (!isFinite(s) || s <= 0) return null;
    return {
      s: s,
      ox: Math.round((toW - fromW * s) / 2),
      oy: Math.round((toH - fromH * s) / 2)
    };
  }

  function applyScalePlanToPlain(p, plan) {
    // Round edges (not size) so neighboring panels keep ~equal gaps after scale.
    var x = Math.round(p.x * plan.s) + plan.ox;
    var y = Math.round(p.y * plan.s) + plan.oy;
    var r = Math.round((p.x + p.w) * plan.s) + plan.ox;
    var b = Math.round((p.y + p.h) * plan.s) + plan.oy;
    var o = {
      id: p.id,
      type: p.type,
      x: x,
      y: y,
      w: Math.max(1, r - x),
      h: p.h,
      z: p.z,
      minimized: !!p.minimized
    };
    if (!o.minimized) o.h = Math.max(1, b - y);
    if (p.board) o.board = p.board;
    if (p._prevH) {
      var pb = Math.round((p.y + p._prevH) * plan.s) + plan.oy;
      o._prevH = Math.max(1, pb - y);
    }
    return o;
  }

  /** Scale plain panel objects in data space (before mount). Avoids clampToStage
   *  crushing a large saved layout into a smaller window, then "scaling" the wreckage.
   *  Uses uniform scale + centering so inter-panel gaps keep their saved ratios. */
  function scalePanelsList(list, fromW, fromH, toW, toH) {
    if (!list || !list.length) return [];
    var out = list.map(function (p) {
      var o = {
        id: p.id,
        type: p.type,
        x: p.x, y: p.y, w: p.w, h: p.h,
        z: p.z,
        minimized: !!p.minimized
      };
      if (p.board) o.board = p.board;
      if (p._prevH) o._prevH = p._prevH;
      return o;
    });
    var plan = layoutScalePlan(fromW, fromH, toW, toH);
    if (!plan) return out;
    if (plan.s === 1 && plan.ox === 0 && plan.oy === 0) return out;
    return out.map(function (p) { return applyScalePlanToPlain(p, plan); });
  }

  /** Apply a design-space layout onto live panels in place (no iframe remount). */
  function applyDesignGeomToLive(designList, fromW, fromH, toW, toH) {
    var plan = layoutScalePlan(fromW, fromH, toW, toH);
    if (!plan) return false;
    var byId = {};
    (designList || []).forEach(function (p) { if (p && p.id) byId[p.id] = p; });
    var ids = Object.keys(panels);
    if (!ids.length) return false;
    for (var i = 0; i < ids.length; i++) {
      if (!byId[ids[i]]) return false;
    }
    ids.forEach(function (id) {
      var src = byId[id];
      var p = panels[id];
      var scaled = applyScalePlanToPlain(src, plan);
      p.x = scaled.x; p.y = scaled.y; p.w = scaled.w;
      if (!p.minimized) p.h = scaled.h;
      if (scaled._prevH) p._prevH = scaled._prevH;
      p.z = scaled.z != null ? scaled.z : p.z;
      applyGeom(p.el, p, { silentContent: true, skipClamp: true });
    });
    lastViewport = { w: toW, h: toH };
    notifyAllContentResize();
    return true;
  }

  /** Mount panels scaled from a design viewport into the current stage.
   *  If the stage is not ready yet, defer until adaptToStageSize / resize. */
  function mountLayoutForViewport(list, fromW, fromH) {
    list = ensureLiveInList(list);
    var s = stageSize();
    if (s.w < 80 || s.h < 80) {
      pendingMount = { list: list, vw: fromW || 0, vh: fromH || 0 };
      return false;
    }
    pendingMount = null;
    var plan = (fromW > 0 && fromH > 0) ? layoutScalePlan(fromW, fromH, s.w, s.h) : null;
    var scaled = !!(plan && (plan.s !== 1 || plan.ox !== 0 || plan.oy !== 0));
    if (fromW > 0 && fromH > 0) {
      list = scalePanelsList(list, fromW, fromH, s.w, s.h);
    }
    mountLayout(list, scaled ? { skipClamp: true } : null);
    lastViewport = { w: s.w, h: s.h };
    // Faithful letterbox must not re-open gaps via GAP-aware untangle / min-size clamp.
    if (!scaled) resolveAllOverlaps();
    notifyAllContentResize();
    return true;
  }

  function scaleLayoutToViewport(fromW, fromH, toW, toH) {
    var plan = layoutScalePlan(fromW, fromH, toW, toH);
    if (!plan) return false;
    if (plan.s === 1 && plan.ox === 0 && plan.oy === 0) return false;
    Object.keys(panels).forEach(function (id) {
      var p = panels[id];
      var scaled = applyScalePlanToPlain(p, plan);
      p.x = scaled.x; p.y = scaled.y; p.w = scaled.w;
      if (!p.minimized) p.h = scaled.h;
      if (scaled._prevH) p._prevH = scaled._prevH;
      applyGeom(p.el, p, { silentContent: true, skipClamp: true });
    });
    lastViewport = { w: toW, h: toH };
    notifyAllContentResize();
    return true;
  }

  function adaptToStageSize(forceSave) {
    if (interacting) return;
    var s = stageSize();
    if (s.w < 80 || s.h < 80) return;
    // Finish a deferred first mount now that the stage has a real size.
    if (pendingMount) {
      var pm = pendingMount;
      if (mountLayoutForViewport(pm.list, pm.vw, pm.vh)) {
        if (forceSave && !layoutLocked) saveLayout();
      }
      return;
    }
    if (!Object.keys(panels).length) {
      lastViewport = { w: s.w, h: s.h };
      return;
    }
    if (!lastViewport.w || !lastViewport.h) {
      lastViewport = { w: s.w, h: s.h };
      // Locked: keep in-memory viewport only — do not PUT scaled coords to disk.
      if (forceSave && !layoutLocked) saveLayout();
      return;
    }
    if (Math.abs(s.w - lastViewport.w) < 2 && Math.abs(s.h - lastViewport.h) < 2) {
      return;
    }
    // Locked: always remap from the saved design baseline so gaps stay faithful
    // across aspect changes (no chained non-uniform / letterbox drift).
    if (layoutLocked && layoutBaseline && layoutBaseline.panels &&
        layoutBaseline.panels.length && layoutBaseline.vw > 0 && layoutBaseline.vh > 0) {
      if (!applyDesignGeomToLive(layoutBaseline.panels, layoutBaseline.vw, layoutBaseline.vh, s.w, s.h)) {
        mountLayoutForViewport(layoutBaseline.panels, layoutBaseline.vw, layoutBaseline.vh);
      }
      return;
    }
    // Unlocked: uniform letterbox from the last stage size; persist new coords.
    if (scaleLayoutToViewport(lastViewport.w, lastViewport.h, s.w, s.h)) {
      if (!layoutLocked) saveLayout();
    }
  }

  function captureLivePlayback() {
    var iframe = document.getElementById('liveIframe');
    var video = document.getElementById('liveVideo');
    var input = document.getElementById('streamUrl');
    var panel = document.querySelector('.fpanel.live-panel');
    var root = document.getElementById('liveFsRoot');
    var url = '';
    try { url = ((input && input.value) || localStorage.getItem(STORAGE_URL) || '').trim(); } catch (e) {}
    var stash = {
      url: url,
      mode: null,
      iframe: null,
      video: null,
      toolbarHidden: !!(panel && panel.classList.contains('live-toolbar-hidden')),
      mediaFill: !!(panel && panel.classList.contains('live-media-fill')),
      cropScale: '',
      cropX: '',
      cropY: ''
    };
    if (root) {
      try {
        stash.cropScale = root.style.getPropertyValue('--live-crop-scale') || '';
        stash.cropX = root.style.getPropertyValue('--live-crop-x') || '';
        stash.cropY = root.style.getPropertyValue('--live-crop-y') || '';
      } catch (e) {}
    }
    if (iframe && iframe.getAttribute('src') && !iframe.classList.contains('hidden')) {
      stash.mode = 'iframe';
      stash.iframe = iframe;
      iframe.remove();
    } else if (video && video.getAttribute('src') && !video.classList.contains('hidden')) {
      stash.mode = 'video';
      stash.video = video;
      video.remove();
    }
    return stash;
  }

  function restoreLivePlayback(stash) {
    if (!stash) return false;
    var input = document.getElementById('streamUrl');
    if (input && stash.url) input.value = stash.url;
    var panel = document.querySelector('.fpanel.live-panel');
    var root = document.getElementById('liveFsRoot');
    var placeholder = document.getElementById('livePlaceholder');
    var liveTag = document.getElementById('liveTag');
    var newIframe = document.getElementById('liveIframe');
    var newVideo = document.getElementById('liveVideo');
    if (panel) {
      if (stash.toolbarHidden) panel.classList.add('live-toolbar-hidden');
      else panel.classList.remove('live-toolbar-hidden');
      if (stash.mediaFill) panel.classList.add('live-media-fill');
      else panel.classList.remove('live-media-fill');
      var tog = document.getElementById('btnLiveUrlTog');
      if (tog) {
        tog.setAttribute('aria-pressed', stash.toolbarHidden ? 'true' : 'false');
        tog.classList.toggle('on', !!stash.toolbarHidden);
      }
      var fsBtn = document.getElementById('btnLiveFs');
      if (fsBtn) {
        fsBtn.setAttribute('aria-pressed', stash.mediaFill ? 'true' : 'false');
        fsBtn.classList.toggle('on', !!stash.mediaFill);
      }
    }
    if (root) {
      if (stash.cropScale) root.style.setProperty('--live-crop-scale', stash.cropScale);
      if (stash.cropX) root.style.setProperty('--live-crop-x', stash.cropX);
      if (stash.cropY) root.style.setProperty('--live-crop-y', stash.cropY);
    }
    if (stash.mode === 'iframe' && stash.iframe && newIframe && newIframe.parentNode) {
      newIframe.parentNode.replaceChild(stash.iframe, newIframe);
      stash.iframe.id = 'liveIframe';
      stash.iframe.classList.remove('hidden');
      if (placeholder) placeholder.classList.add('hidden');
      if (newVideo) {
        newVideo.classList.add('hidden');
        newVideo.removeAttribute('src');
        if (newVideo.pause) newVideo.pause();
      }
      if (liveTag) liveTag.textContent = 'iframe';
      try { hardenLiveIframe(stash.iframe); } catch (e) {}
      try { syncLiveFsRootClass(); } catch (e) {}
      return true;
    }
    if (stash.mode === 'video' && stash.video && newVideo && newVideo.parentNode) {
      newVideo.parentNode.replaceChild(stash.video, newVideo);
      stash.video.id = 'liveVideo';
      stash.video.classList.remove('hidden');
      if (placeholder) placeholder.classList.add('hidden');
      if (newIframe) {
        newIframe.classList.add('hidden');
        newIframe.removeAttribute('src');
      }
      if (liveTag) liveTag.textContent = 'video';
      try { syncLiveFsRootClass(); } catch (e) {}
      return true;
    }
    return false;
  }
  function clearPanels() {
    Object.keys(panels).forEach(function (id) {
      if (panels[id].el) panels[id].el.remove();
    });
    panels = {};
  }

  function mountLayout(list, opts) {
    var liveStash = captureLivePlayback();
    clearLiveMediaFill();
    clearPanels();
    var maxZ = 10;
    list.forEach(function (raw) {
      var st = {
        id: raw.id,
        type: raw.type || (raw.id === 'live' ? 'live' : 'board'),
        board: raw.board || 'timing',
        x: raw.x, y: raw.y, w: raw.w, h: raw.h,
        z: raw.z || 10,
        minimized: !!raw.minimized,
        _prevH: raw._prevH
      };
      if (st.z > maxZ) maxZ = st.z;
      var el = st.type === 'live' ? createLivePanel(st) : createBoardPanel(st);
      bindPanel(st, el, opts);
    });
    zCounter = maxZ;
    // re-wire live stream refs after remount
    wireLiveControls();
    if (!restoreLivePlayback(liveStash) && liveStash && liveStash.url) {
      applyStream(liveStash.url);
    }
  }

  function normalizeSaved(parsed) {
    // v3: { vw, vh, panels: [...] } ; v2: bare array
    if (Array.isArray(parsed)) {
      return { vw: 0, vh: 0, panels: parsed };
    }
    if (parsed && Array.isArray(parsed.panels)) {
      return {
        vw: parsed.vw || 0,
        vh: parsed.vh || 0,
        panels: parsed.panels
      };
    }
    return null;
  }

  function loadSavedOrDefault() {
    var raw;
    try { raw = localStorage.getItem(STORAGE_LAYOUT); } catch (e) {}
    if (raw) {
      try {
        var parsed = normalizeSaved(JSON.parse(raw));
        if (parsed && parsed.panels.length) {
          setLayoutBaselineFromPlain(parsed);
          mountLayoutForViewport(parsed.panels, parsed.vw, parsed.vh);
          if (!layoutLocked) saveLayout();
          return;
        }
      } catch (e) {}
    }
    mountLayout(defaultLayout());
    resolveAllOverlaps();
    rememberViewport();
    setLayoutBaselineFromPlain(currentLayoutPlain());
    if (!layoutLocked) saveLayout();
  }

  function nextPanelId() {
    var n = 1;
    while (panels['p' + n] || document.querySelector('[data-panel-id="p' + n + '"]')) n++;
    // also avoid colliding with serialized ids not in DOM yet
    var used = {};
    Object.keys(panels).forEach(function (k) { used[k] = true; });
    while (used['p' + n]) n++;
    return 'p' + n;
  }

  document.getElementById('btnAddPanel').addEventListener('click', function () {
    if (layoutLocked) return;
    var id = nextPanelId();
    zCounter += 1;
    var w = 320, h = 240;
    var spot = findFreeSpot(w, h);
    var st = {
      id: id, type: 'board', board: 'timing',
      x: spot.x, y: spot.y,
      w: w, h: h, z: zCounter, minimized: false
    };
    var el = createBoardPanel(st);
    bindPanel(st, el);
    trySeparate(st, null);
    applyGeom(el, st);
    bringToFront(id);
    saveLayout();
  });

  // ---- layout menu (save / restore / reset) ----
  var layoutPresetMenu = null;
  var layoutPresetOpen = false;

  function readPresets() {
    if (presetsCache && typeof presetsCache === 'object' && !Array.isArray(presetsCache)) {
      return presetsCache;
    }
    try {
      var raw = localStorage.getItem(STORAGE_PRESETS);
      if (!raw) return {};
      var o = JSON.parse(raw);
      if (o && typeof o === 'object' && !Array.isArray(o)) {
        presetsCache = o;
        return o;
      }
    } catch (e) {}
    return {};
  }

  function writePresets(map) {
    presetsCache = map && typeof map === 'object' && !Array.isArray(map) ? map : {};
    try { localStorage.setItem(STORAGE_PRESETS, JSON.stringify(presetsCache)); } catch (e) {}
    persistLayoutsToFile(true);
  }

  function nextDefaultPresetName(presets) {
    var n = 1;
    while (presets['布局' + n]) n++;
    return '布局' + n;
  }

  function currentLayoutSnapshot() {
    var s = stageSize();
    if (s.w > 0 && s.h > 0) lastViewport = { w: s.w, h: s.h };
    var theme = document.documentElement.getAttribute('data-theme') || 'night';
    return {
      savedAt: Date.now(),
      theme: theme === 'day' ? 'day' : 'night',
      vw: lastViewport.w || 0,
      vh: lastViewport.h || 0,
      panels: serialize()
    };
  }

  function applyLayoutSnapshot(snap) {
    if (!snap || !Array.isArray(snap.panels) || !snap.panels.length) return false;
    setLayoutBaselineFromPlain({
      vw: snap.vw || 0,
      vh: snap.vh || 0,
      panels: snap.panels
    });
    mountLayoutForViewport(snap.panels, snap.vw || 0, snap.vh || 0);
    try {
      var savedUrl = localStorage.getItem(STORAGE_URL);
      if (savedUrl) {
        var input = document.getElementById('streamUrl');
        if (input) input.value = savedUrl;
        applyStream(savedUrl);
      }
    } catch (e) {}
    if (snap.theme === 'day' || snap.theme === 'night') {
      applyTheme(snap.theme, true);
    }
    saveLayout();
    return true;
  }

  function flashLayoutMenuBtn(tempText) {
    var btn = document.getElementById('btnLayoutMenu');
    if (!btn) return;
    var old = btn.textContent;
    btn.textContent = tempText;
    setTimeout(function () {
      if (btn.textContent === tempText) btn.textContent = old || '布局 ▾';
    }, 1200);
  }

  function saveCurrentLayoutPreset() {
    var presets = readPresets();
    var def = nextDefaultPresetName(presets);
    var name = window.prompt('保存当前布局为：', def);
    if (name == null) return;
    name = String(name).trim();
    if (!name) return;
    if (presets[name]) {
      if (!window.confirm('已有同名布局「' + name + '」，要覆盖吗？')) return;
    }
    presets[name] = currentLayoutSnapshot();
    writePresets(presets);
    flashLayoutMenuBtn('已保存');
  }

  function resetLayoutToDefault() {
    try { localStorage.removeItem(STORAGE_LAYOUT); } catch (e) {}
    mountLayout(defaultLayout());
    resolveAllOverlaps();
    rememberViewport();
    notifyAllContentResize();
    try {
      var saved = localStorage.getItem(STORAGE_URL);
      if (saved) {
        var input = document.getElementById('streamUrl');
        if (input) input.value = saved;
        applyStream(saved);
      }
    } catch (e) {}
    saveLayout();
  }

  function closeLayoutMenu() {
    if (layoutPresetMenu) layoutPresetMenu.classList.remove('open');
    layoutPresetOpen = false;
    var btn = document.getElementById('btnLayoutMenu');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }

  function ensureLayoutMenu() {
    if (layoutPresetMenu) return layoutPresetMenu;
    layoutPresetMenu = document.createElement('div');
    layoutPresetMenu.id = 'layout-preset-menu';
    layoutPresetMenu.setAttribute('role', 'menu');
    document.body.appendChild(layoutPresetMenu);
    layoutPresetMenu.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    layoutPresetMenu.addEventListener('click', function (e) {
      var act = e.target.closest('.layout-action');
      if (act) {
        e.preventDefault();
        e.stopPropagation();
        var action = act.getAttribute('data-action');
        closeLayoutMenu();
        if (action === 'save') saveCurrentLayoutPreset();
        else if (action === 'reset') {
          if (layoutLocked) {
            flashLayoutMenuBtn('请先解锁');
            return;
          }
          resetLayoutToDefault();
        }
        return;
      }
      var del = e.target.closest('.layout-opt-del');
      if (del) {
        e.preventDefault();
        e.stopPropagation();
        if (layoutLocked) {
          flashLayoutMenuBtn('请先解锁');
          return;
        }
        var name = del.getAttribute('data-name');
        if (!name) return;
        if (!window.confirm('删除已保存的布局「' + name + '」？')) return;
        var presets = readPresets();
        delete presets[name];
        writePresets(presets);
        renderLayoutMenu();
        return;
      }
      var opt = e.target.closest('.layout-opt');
      if (!opt) return;
      var applyName = opt.getAttribute('data-name');
      if (!applyName) return;
      var map = readPresets();
      var snap = map[applyName];
      closeLayoutMenu();
      if (!snap) return;
      applyLayoutSnapshot(snap);
    });
    return layoutPresetMenu;
  }

  function renderLayoutMenu() {
    var menu = ensureLayoutMenu();
    var presets = readPresets();
    var names = Object.keys(presets).sort(function (a, b) {
      var ta = (presets[a] && presets[a].savedAt) || 0;
      var tb = (presets[b] && presets[b].savedAt) || 0;
      if (tb !== ta) return tb - ta;
      return a.localeCompare(b, 'zh');
    });
    var html = '<button type="button" class="layout-action" role="menuitem" data-action="save">保存当前布局…</button>';
    html += '<div class="layout-sep" role="separator"></div>';
    if (!names.length) {
      html += '<div class="layout-empty">暂无已保存的布局</div>';
    } else {
      html += names.map(function (name) {
        var safe = String(name)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
        return '<div class="layout-opt" role="menuitem" data-name="' + safe + '" tabindex="0">' +
          '<span class="layout-opt-name" title="' + safe + '">' + safe + '</span>' +
          '<button type="button" class="layout-opt-del" data-name="' + safe + '"' +
          (layoutLocked
            ? ' disabled title="请先解锁布局" aria-label="删除（已锁定）"'
            : ' title="删除此布局" aria-label="删除"') +
          '>×</button>' +
          '</div>';
      }).join('');
    }
    html += '<div class="layout-sep" role="separator"></div>';
    html += '<button type="button" class="layout-action danger" role="menuitem" data-action="reset"' +
      (layoutLocked ? ' disabled title="锁定中不可重置" aria-disabled="true"' : '') + '>重置布局</button>';
    menu.innerHTML = html;
  }

  function openLayoutMenu() {
    var btn = document.getElementById('btnLayoutMenu');
    if (!btn) return;
    if (layoutPresetOpen) {
      closeLayoutMenu();
      return;
    }
    closeBoardDd();
    renderLayoutMenu();
    var menu = ensureLayoutMenu();
    var r = btn.getBoundingClientRect();
    menu.classList.add('open');
    layoutPresetOpen = true;
    btn.setAttribute('aria-expanded', 'true');
    var mw = Math.max(r.width, 200);
    menu.style.minWidth = mw + 'px';
    var mh = menu.offsetHeight;
    var left = r.left;
    var top = r.bottom + 4;
    if (left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }

  document.getElementById('btnLayoutMenu').addEventListener('click', function (e) {
    e.stopPropagation();
    openLayoutMenu();

  document.addEventListener('mousedown', function (e) {

  // ---- live stream ----
  function hideLive() {
    var liveIframe = document.getElementById('liveIframe');
    var liveVideo = document.getElementById('liveVideo');
    var placeholder = document.getElementById('livePlaceholder');
    var liveTag = document.getElementById('liveTag');
    if (!liveIframe) return;
    liveIframe.classList.add('hidden');
    liveVideo.classList.add('hidden');
    liveIframe.removeAttribute('src');
    liveVideo.removeAttribute('src');
    if (liveVideo.pause) liveVideo.pause();
    if (placeholder) placeholder.classList.remove('hidden');
    if (liveTag) liveTag.textContent = '占位';
    syncLiveFsRootClass();
  }

  function isDirectVideo(url) {
    return /\.(mp4|webm|ogg|m3u8)(\?|#|$)/i.test(url);
  }

    function applyStream(url) {
    url = (url || '').trim();
    var liveIframe = document.getElementById('liveIframe');
    var liveVideo = document.getElementById('liveVideo');
    var placeholder = document.getElementById('livePlaceholder');
    var liveTag = document.getElementById('liveTag');
    if (!liveIframe) return;
    if (!url) { hideLive(); return; }
    if (placeholder) placeholder.classList.add('hidden');
    if (isDirectVideo(url)) {
      var sameVideo = liveVideo && liveVideo.getAttribute('src') === url && !liveVideo.classList.contains('hidden');
      if (sameVideo) {
        syncLiveFsRootClass();
        try { localStorage.setItem(STORAGE_URL, url); } catch (e) {}
        return;
      }
      liveIframe.classList.add('hidden');
      liveIframe.removeAttribute('src');
      liveVideo.classList.remove('hidden');
      liveVideo.src = url;
      if (liveVideo.play) liveVideo.play().catch(function () {});
      if (liveTag) liveTag.textContent = 'video';
    } else {
      var sameFrame = liveIframe.getAttribute('src') === url && !liveIframe.classList.contains('hidden');
      if (sameFrame) {
        if (liveVideo) {
          liveVideo.classList.add('hidden');
          liveVideo.removeAttribute('src');
          if (liveVideo.pause) liveVideo.pause();
        }
        hardenLiveIframe(liveIframe);
        if (liveTag) liveTag.textContent = 'iframe';
        syncLiveFsRootClass();
        try { localStorage.setItem(STORAGE_URL, url); } catch (e) {}
        return;
      }
      liveVideo.classList.add('hidden');
      liveVideo.removeAttribute('src');
      hardenLiveIframe(liveIframe);
      liveIframe.classList.remove('hidden');
      liveIframe.src = url;
      if (liveTag) liveTag.textContent = 'iframe';
    }
    syncLiveFsRootClass();
    try { localStorage.setItem(STORAGE_URL, url); } catch (e) {}
  }

  function getLiveFsRoot() {
    return document.getElementById('liveFsRoot');

  function getLivePanelEl() {
    var root = getLiveFsRoot();
    return root ? root.closest('.fpanel.live-panel') : null;

  function liveFsElement() {

  function isLiveMediaFill() {

  function clearLiveMediaFill() {

  // Huya/QQ-like: player center-left, chat right, nav top — zoom+pan crops chrome.
  var LIVE_CROP_DEFAULT = { scale: 1.45, x: 6, y: 4 };
  var LIVE_CROP_HUYA = { scale: 1.55, x: 8, y: 6 };
  var liveCrop = { scale: LIVE_CROP_DEFAULT.scale, x: LIVE_CROP_DEFAULT.x, y: LIVE_CROP_DEFAULT.y };

  function clampCrop(c) {
    return {
      scale: Math.max(1, Math.min(2.6, Math.round((Number(c.scale) || 1) * 100) / 100)),
      x: Math.max(-40, Math.min(40, Math.round(Number(c.x) || 0))),
      y: Math.max(-40, Math.min(40, Math.round(Number(c.y) || 0)))
    };
  }

  function loadLiveCrop() {
    try {
      var raw = localStorage.getItem(STORAGE_CROP);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') liveCrop = clampCrop(parsed);
    } catch (e) {}
  }

  function saveLiveCrop() {
    try { localStorage.setItem(STORAGE_CROP, JSON.stringify(liveCrop)); } catch (e) {}
  }

  function applyLiveCropVars() {
    var root = getLiveFsRoot();
    if (!root) return;
    liveCrop = clampCrop(liveCrop);
    root.style.setProperty('--live-crop-scale', String(liveCrop.scale));
    root.style.setProperty('--live-crop-x', liveCrop.x + '%');
    root.style.setProperty('--live-crop-y', liveCrop.y + '%');
    var label = document.getElementById('liveCropScaleLabel');
    if (label) label.textContent = liveCrop.scale.toFixed(2).replace(/\.0$/, '').replace(/(\.\d)0$/, '$1') + '×';
  }

  function nudgeLiveCrop(action) {
    if (action === 'scale+') liveCrop.scale += 0.05;
    else if (action === 'scale-') liveCrop.scale -= 0.05;
    else if (action === 'left') liveCrop.x -= 2;
    else if (action === 'right') liveCrop.x += 2;
    else if (action === 'up') liveCrop.y -= 2;
    else if (action === 'down') liveCrop.y += 2;
    else if (action === 'reset') liveCrop = { scale: LIVE_CROP_DEFAULT.scale, x: LIVE_CROP_DEFAULT.x, y: LIVE_CROP_DEFAULT.y };
    else if (action === 'preset-huya') liveCrop = { scale: LIVE_CROP_HUYA.scale, x: LIVE_CROP_HUYA.x, y: LIVE_CROP_HUYA.y };
    else return;
    liveCrop = clampCrop(liveCrop);
    applyLiveCropVars();
    saveLiveCrop();
  }

  function wireLiveCropUi() {
    var ui = document.getElementById('liveCropUi');
    if (!ui || ui.dataset.wired === '1') return;
    ui.dataset.wired = '1';
    ui.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('[data-crop]') : null;
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      nudgeLiveCrop(btn.getAttribute('data-crop'));
    });
    ui.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  }

  function setLiveMediaFill(on) {
    var panel = getLivePanelEl();
    var root = getLiveFsRoot();
    if (!panel || !root) {
      updateLiveFsButton();
      return;
    }
    panel.classList.toggle('live-media-fill', !!on);
    root.classList.toggle('live-media-fill', !!on);
    if (on) applyLiveCropVars();
    updateLiveFsButton();
  }

  var LIVE_FS_TITLE_OFF = '铺满裁切：放大播放器区域并裁切网页四周；站点布局不同时用左下角微调。播放器自带全屏会被退出。快捷键 F / Esc 退出';
  var LIVE_FS_TITLE_ON = '退出铺满：恢复面板内正常显示。Esc / F';
  var LIVE_FS_LABEL_OFF = '⛶ 铺满裁切';
  var LIVE_FS_LABEL_ON = '⛶ 退出铺满';

  function updateLiveFsButton() {
    var btn = document.getElementById('btnLiveFs');
    if (!btn) return;
    var on = isLiveMediaFill();
    btn.classList.toggle('on', on);
    btn.title = on ? LIVE_FS_TITLE_ON : LIVE_FS_TITLE_OFF;
    btn.textContent = on ? LIVE_FS_LABEL_ON : LIVE_FS_LABEL_OFF;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function exitAnyFullscreen() {
    var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (!exit) return Promise.resolve();
    try {
      var r = exit.call(document);
      if (r && typeof r.then === 'function') return r.catch(function () {});
      return Promise.resolve();
    } catch (e) {
      return Promise.resolve();
    }
  }

  function toggleLiveFullscreen() {
    setLiveMediaFill(!isLiveMediaFill());
  }

  function hardenLiveIframe(iframe) {
    if (!iframe) return;
    try { iframe.removeAttribute('allowfullscreen'); } catch (e) {}
    try { iframe.removeAttribute('webkitallowfullscreen'); } catch (e) {}
    try { iframe.removeAttribute('mozallowfullscreen'); } catch (e) {}
    // No fullscreen feature policy; keep playback-related tokens only.
    try { iframe.setAttribute('allow', 'autoplay; picture-in-picture'); } catch (e) {}
    // Omit allow-fullscreen so in-iframe Fullscreen API is blocked when sandbox sticks.
    try {
      iframe.setAttribute(
        'sandbox',
        'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation'
      );
    } catch (e) {}
  }

  function syncLiveFsRootClass() {
    var root = getLiveFsRoot();
    var iframe = document.getElementById('liveIframe');
    if (!root) return;
    var show = !!(iframe && !iframe.classList.contains('hidden') && iframe.getAttribute('src'));
    root.classList.toggle('has-iframe', show);
  }

  function wireLiveFullscreen() {
    var btn = document.getElementById('btnLiveFs');
    var video = document.getElementById('liveVideo');
    var iframe = document.getElementById('liveIframe');
    hardenLiveIframe(iframe);
    syncLiveFsRootClass();
    wireLiveCropUi();
    applyLiveCropVars();
    if (btn && btn.dataset.fsWired !== '1') {
      btn.dataset.fsWired = '1';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        e.preventDefault();
        toggleLiveFullscreen();
      });
      btn.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    }
    if (video) {
      try { video.setAttribute('controlsList', 'nofullscreen'); } catch (e) {}
    }
    if (!window.__liveFsDocWired) {
      window.__liveFsDocWired = true;
      loadLiveCrop();
      applyLiveCropVars();
      function onFsChange() {
        // Any native fullscreen (foreign iframe / video / accidental): exit only.
        // Never reclaim with requestFullscreen — that surprised users with OS fullscreen.
        var fs = liveFsElement();
        if (!fs) return;
        exitAnyFullscreen().then(function () {
          updateLiveFsButton();
        }, function () {
          updateLiveFsButton();
        });
      }
      document.addEventListener('fullscreenchange', onFsChange);
      document.addEventListener('webkitfullscreenchange', onFsChange);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (isLiveMediaFill()) setLiveMediaFill(false);
          if (liveFsElement()) exitAnyFullscreen();
          return;
        }
        if (e.key !== 'f' && e.key !== 'F') return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var t = e.target;
        var tag = (t && t.tagName) ? t.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || (t && t.isContentEditable)) return;
        if (!getLiveFsRoot()) return;
        e.preventDefault();
        toggleLiveFullscreen();
      });
    }
    updateLiveFsButton();
  }

  function isLiveToolbarHidden() {
    try { return localStorage.getItem(STORAGE_LIVE_TB) === '1'; } catch (e) { return false; }
  }

  function applyLiveToolbarHidden(hidden, persist) {
    var panel = document.querySelector('.fpanel.live-panel');
    var btn = document.getElementById('btnLiveUrlTog');
    if (panel) panel.classList.toggle('live-toolbar-hidden', !!hidden);
    if (btn) {
      btn.classList.toggle('on', !!hidden);
      btn.setAttribute('aria-pressed', hidden ? 'true' : 'false');
      btn.title = hidden ? '显示地址与延迟栏' : '隐藏地址与延迟栏';
    }
    if (persist) {
      try {
        if (hidden) localStorage.setItem(STORAGE_LIVE_TB, '1');
        else localStorage.removeItem(STORAGE_LIVE_TB);
      } catch (e) {}
      if (typeof persistLayoutsToFile === 'function') persistLayoutsToFile(false);
    }
  }

  function wireLiveToolbarToggle() {
    var btn = document.getElementById('btnLiveUrlTog');
    if (!btn || btn.dataset.wired === '1') {
      applyLiveToolbarHidden(isLiveToolbarHidden(), false);
      return;
    }
    btn.dataset.wired = '1';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      applyLiveToolbarHidden(!isLiveToolbarHidden(), true);
    });
    btn.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    applyLiveToolbarHidden(isLiveToolbarHidden(), false);
  }

  function wireLiveControls() {
    wireLiveFullscreen();
    wireLiveToolbarToggle();
    var btnApply = document.getElementById('btnApply');
    var btnClear = document.getElementById('btnClear');
    var streamInput = document.getElementById('streamUrl');
    if (!btnApply || !btnClear || !streamInput) return;
    if (btnApply.dataset.wired === '1') return;
    btnApply.dataset.wired = '1';
    btnClear.dataset.wired = '1';
    streamInput.dataset.wired = '1';
    btnApply.addEventListener('click', function (e) {
      e.stopPropagation();
      applyStream(streamInput.value);
    });
    btnClear.addEventListener('click', function (e) {
      e.stopPropagation();
      streamInput.value = '';
      try { localStorage.removeItem(STORAGE_URL); } catch (err) {}
      hideLive();
    });
    streamInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        applyStream(streamInput.value);
      }
    });
    // clicking the bar should not start a panel drag
    streamInput.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    btnApply.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    btnClear.addEventListener('mousedown', function (e) { e.stopPropagation(); });

    var delaySlider = document.getElementById('delaySlider');
    var delaySec = document.getElementById('delaySec');
    var btnDelayApply = document.getElementById('btnDelayApply');
    var btnDelayReset = document.getElementById('btnDelayReset');
    if (!delaySlider || !delaySec || !btnDelayApply || !btnDelayReset) return;
    if (btnDelayApply.dataset.wired === '1') {
      syncDelayInputs(streamDelaySec);
      updateDelayStatus({ ready: streamDelaySec <= 0 || !!displayState, waitSec: 0 });
      return;
    }
    btnDelayApply.dataset.wired = '1';
    delaySlider.addEventListener('input', function () {
      delaySec.value = String(clampDelaySec(delaySlider.value));
    });
    delaySec.addEventListener('input', function () {
      var v = clampDelaySec(delaySec.value);
      delaySec.value = String(v);
      delaySlider.value = String(v);
    });
    delaySec.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        applyStreamDelay(delaySec.value, true);
      }
    });
    btnDelayApply.addEventListener('click', function (e) {
      e.stopPropagation();
      applyStreamDelay(delaySec.value, true);
    });
    btnDelayReset.addEventListener('click', function (e) {
      e.stopPropagation();
      applyStreamDelay(0, true);
    });
    [delaySlider, delaySec, btnDelayApply, btnDelayReset].forEach(function (node) {
      node.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    });
    syncDelayInputs(streamDelaySec);
    updateDelayStatus({ ready: streamDelaySec <= 0 || !!displayState, waitSec: 0 });
  }

  // ---- health + shared feed ----
  // Director must be opened via http://127.0.0.1:8720/director.html (Start.cmd).
  // Opening the file:// copy makes fetch() fail CORS → false "未连接" while
  // board iframes still work.
  var statusEl = document.getElementById('rcStatus');
  // One failed /api/health poll must not flip the UI red: a brief blip (or
  // sleeping laptop) used to call setBoardFeedOk(false), and the green dots
  // stayed red until the next SSE "state" — which never comes while the feed
  // is quiet (backend only sends ": ping" comments). Require a short streak.
  var healthFailStreak = 0;
  var HEALTH_FAIL_LIMIT = 3; // 3 × 8s ≈ 24s before "未连接"
  function checkHealth() {
    fetch(RC + '/api/health', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.json().catch(function () { return {}; });
      })
      .then(function (h) {
        healthFailStreak = 0;
        var feedOk = !!(h && (h.open || h.listenerOpen));
        var msg = 'Director：已连接 :8720';
        msg += feedOk ? ' · 数据源在线' : ' · 等待赛会数据';
        if (h && h.clients != null) msg += ' · 推送 ' + h.clients;
        statusEl.textContent = msg;
        statusEl.className = 'status ok';
        if (!feedEs || feedEs.readyState === 2) connectFeed();
        // Treat an open EventSource as connected even when no state events.
        if (feedEs && feedEs.readyState === 1) setBoardFeedOk(true);
        // Seed boards if SSE is quiet but /api/state has data
        if (!stateBuffer.length) {
          fetch(RC + '/api/state', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (s) {
              ingestLiveState(s);
            })
            .catch(function () {});
        }
      })
      .catch(function () {
        healthFailStreak++;
        var originHint = (location.protocol === 'file:')
          ? '（请用 Start.cmd 打开，不要双击 html）'
          : '（请先运行 Start.cmd）';
        if (healthFailStreak >= HEALTH_FAIL_LIMIT) {
          statusEl.textContent = 'Director：未连接' + originHint;
          statusEl.className = 'status bad';
          setBoardFeedOk(false);
        } else {
          // Soft warning — keep last OK label/dots until streak confirms drop.
          statusEl.textContent = 'Director：连接不稳定，重试中… (' +
            healthFailStreak + '/' + HEALTH_FAIL_LIMIT + ')';
          statusEl.className = 'status';
        }
      });
  }


  function updateLayoutLockUi() {
    var btn = document.getElementById('btnLayoutLock');
    var locked = !!layoutLocked;
    document.body.classList.toggle('layout-locked', locked);
    if (btn) {
      btn.setAttribute('aria-pressed', locked ? 'true' : 'false');
      btn.title = locked
        ? '布局已锁定：可切换预设，不可拖动/缩放/增删/重置'
        : '锁定布局（禁止拖动/缩放/增删面板）';
      btn.setAttribute('aria-label', locked ? '解锁布局' : '锁定布局');
    }
    var hint = document.querySelector('.hint-bar');
    if (hint) {
      hint.textContent = locked
        ? '布局已锁定 · 点顶栏锁图标解锁后可再拖动/缩放'
        : '拖到另一块上松开 = 交换 · 拖到空白处自动避让（不重叠） · 拖边缘放大时邻块沿共享边自动缩小 · 窗口缩放按比例适配';
    }
  }

  function setLayoutLocked(on, persist) {
    var next = !!on;
    if (next && !layoutLocked) {
      // Locking freezes what is currently on screen as the saved baseline.
      setLayoutBaselineFromPlain(currentLayoutPlain());
    }
    layoutLocked = next;
    updateLayoutLockUi();
    try { localStorage.setItem(STORAGE_LAYOUT_LOCK, layoutLocked ? '1' : '0'); } catch (e) {}
    if (persist !== false) persistLayoutsToFile(false);
  }

  function loadLayoutLock() {
    var v = null;
    try { v = localStorage.getItem(STORAGE_LAYOUT_LOCK); } catch (e) {}
    // Default ON for new users (no key yet). Explicit "0" stays unlocked.
    if (v == null || v === '') layoutLocked = true;
    else layoutLocked = v === '1' || v === 'true';
    updateLayoutLockUi();
  }

  document.getElementById('btnLayoutLock').addEventListener('click', function (e) {
    e.stopPropagation();
    setLayoutLocked(!layoutLocked, true);
  });

  document.getElementById('btnThemeDay').addEventListener('click', function (e) {
    setThemeFromUi('day', e);
  });
  document.getElementById('btnThemeNight').addEventListener('click', function (e) {
    setThemeFromUi('night', e);
  });

  function applyLayoutsFileData(data) {
    if (!data || typeof data !== 'object') return false;
    if (data.presets && typeof data.presets === 'object' && !Array.isArray(data.presets)) {
      presetsCache = data.presets;
      try { localStorage.setItem(STORAGE_PRESETS, JSON.stringify(presetsCache)); } catch (e) {}
    }
    if (data.theme === 'day' || data.theme === 'night') {
      applyTheme(data.theme, false);
      try { localStorage.setItem(STORAGE_THEME, data.theme); } catch (e) {}
    }
    if (typeof data.streamUrl === 'string' && data.streamUrl) {
      try { localStorage.setItem(STORAGE_URL, data.streamUrl); } catch (e) {}
    }
    if (data.liveToolbarHidden != null) {
      try { localStorage.setItem(STORAGE_LIVE_TB, data.liveToolbarHidden ? '1' : '0'); } catch (e) {}
    }
    if (data.layoutLocked != null) {
      layoutLocked = !!data.layoutLocked;
      try { localStorage.setItem(STORAGE_LAYOUT_LOCK, layoutLocked ? '1' : '0'); } catch (e) {}
      updateLayoutLockUi();
    }
    if (Array.isArray(data.timingColumns)) {
      applyTimingColumnsPref(data.timingColumns);
    }
    var cur = normalizeSaved(data.current);
    if (!(cur && cur.panels && cur.panels.length)) return false;
    try { localStorage.setItem(STORAGE_LAYOUT, JSON.stringify(cur)); } catch (e) {}
    setLayoutBaselineFromPlain(cur);
    mountLayoutForViewport(cur.panels, cur.vw, cur.vh);
    // Iframes mount async; onload also pushes cols — nudge once for already-ready frames.
    if (Array.isArray(data.timingColumns)) pushTimingColsToAllBoards();
    return true;
  }

  function fetchLayoutsFile() {
    return fetch(LAYOUTS_API, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('api ' + r.status);
        layoutsFileOk = true;
        return r.json();
      })
      .catch(function () {
        return fetch(LAYOUTS_FILE, { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('file ' + r.status);
            layoutsFileOk = true;
            return r.json();
          });
      })
      .catch(function () {
        layoutsFileOk = false;
        return null;
      });
  }

  // init — 项目 layouts.json 为真相；没有/坏了再用 localStorage，再不行默认布局
  loadTheme();
  loadStreamDelay();
  loadLayoutLock();
  ensureDelayTicker();
  fetchLayoutsFile().then(function (data) {
    var fromFile = applyLayoutsFileData(data);
    if (!fromFile) {
      // migrate any browser-only presets into cache before default mount
      try {
        var rawP = localStorage.getItem(STORAGE_PRESETS);
        if (rawP) {
          var o = JSON.parse(rawP);
          if (o && typeof o === 'object' && !Array.isArray(o)) presetsCache = o;
        }
      } catch (e) {}
      loadSavedOrDefault();
    }
    try {
      var savedUrl = localStorage.getItem(STORAGE_URL);
      if (savedUrl) {
        document.getElementById('streamUrl').value = savedUrl;
        applyStream(savedUrl);
      }
    } catch (e) {}
    try {
      applyLiveToolbarHidden(localStorage.getItem(STORAGE_LIVE_TB) === '1', false);
    } catch (e) {}
    syncDelayInputs(streamDelaySec);
    updateDelayStatus({ ready: streamDelaySec <= 0 || !!displayState, waitSec: 0 });
    updateLayoutLockUi();
    layoutsHydrated = true;
    // Ensure project file exists / is refreshed (also migrates localStorage → file).
    // When locked, payload.current comes from layoutBaseline (not stage-scaled).
    persistLayoutsToFile(true);
    // Stage size can still be settling (Edge --app restore); reflow a few times.
    setTimeout(function () { adaptToStageSize(true); }, 0);
    setTimeout(function () { adaptToStageSize(true); }, 100);
    setTimeout(function () { adaptToStageSize(true); }, 400);
  });

  // ---- lifecycle heartbeat (Run-Director.ps1 listens on :8721) ----
  // Close tab → pagehide sends /goodbye; PS waits ~3s then kills Java unless a
  // fresh heartbeat arrives (F5 reload cancels). MissGraceSec (~10s) is backup
  // if the tab dies without a beacon. Enter / Stop.cmd still work.
  // Prefer a Worker timer: main-thread setInterval is heavily throttled in
  // background tabs and used to miss a short grace → false "server died".
  function sendDirectorHeartbeat() {
    try {
      if (typeof navigator !== 'undefined' && typeof navigator.sendBeacon === 'function') {
        navigator.sendBeacon(HB);
      }
    } catch (e) {}
    try {
      fetch(HB + '?t=' + Date.now(), {
        method: 'GET',
        cache: 'no-store',
        mode: 'cors',
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }
  function sendDirectorGoodbye() {
    // Arm a short pending-stop on the PS host. Do not use for visibility alone.
    try {
      if (typeof navigator !== 'undefined' && typeof navigator.sendBeacon === 'function') {
        navigator.sendBeacon(HB_GOODBYE);
      }
    } catch (e) {}
    try {
      fetch(HB_GOODBYE + '?t=' + Date.now(), {
        method: 'POST',
        cache: 'no-store',
        mode: 'cors',
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }
  sendDirectorHeartbeat();
  var hbIntervalId = null;
  try {
    var hbBlob = new Blob(
      ['setInterval(function () { postMessage(1); }, 6000);'],
      { type: 'application/javascript' }
    );
    var hbWorker = new Worker(URL.createObjectURL(hbBlob));
    hbWorker.onmessage = function () { sendDirectorHeartbeat(); };
  } catch (e) {
    hbIntervalId = setInterval(sendDirectorHeartbeat, 6000);
  }
  // Fallback / belt-and-suspenders if Worker is also throttled.
  if (!hbIntervalId) {
    hbIntervalId = setInterval(sendDirectorHeartbeat, 6000);
  }
  window.addEventListener('pagehide', function (ev) {
    // bfcache freeze (persisted): keep the server; page may come back.
    // Real close / navigate / F5: goodbye. F5 reconnects within GoodbyeGrace.
    if (ev && ev.persisted) {
      sendDirectorHeartbeat();
      return;
    }
    sendDirectorGoodbye();
  });
  // beforeunload: keep a heartbeat so soft navigations stay alive until
  // pagehide decides goodbye; do not arm stop here (F5 fires this too).
  window.addEventListener('beforeunload', sendDirectorHeartbeat);
  document.addEventListener('visibilitychange', function () {
    // Tab switch must NOT goodbye — only refresh the beat.
    sendDirectorHeartbeat();
  });

  connectFeed();
  checkHealth();
  setInterval(checkHealth, 8000);

  function onViewportChange() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resizeTimer = null;
      adaptToStageSize(true);
    }, 80);
  }

  window.addEventListener('resize', onViewportChange);
  document.addEventListener('fullscreenchange', onViewportChange);
  document.addEventListener('webkitfullscreenchange', onViewportChange);
  // Stage element size (more reliable than window alone for --app / DPI).
  try {
    if (typeof ResizeObserver !== 'undefined' && stage) {
      var stageRoPending = null;
      var stageRo = new ResizeObserver(function () {
        if (stageRoPending) cancelAnimationFrame(stageRoPending);
        stageRoPending = requestAnimationFrame(function () {
          stageRoPending = null;
          onViewportChange();
        });
      });
      stageRo.observe(stage);
    }
  } catch (e) {}
  // first paint: stage may still be settling after window open / maximize
  window.addEventListener('load', function () {
    setTimeout(function () { adaptToStageSize(true); }, 50);
    setTimeout(function () { adaptToStageSize(true); }, 250);
    setTimeout(function () { adaptToStageSize(true); }, 600);
  });
})();
</script>
